name: Publish verified native helper repair
on:
  push:
    branches: [fix/native-helper-lifecycle-4-248]
    paths: [.github/workflows/publish-native-helper.yml]
permissions:
  contents: write
concurrency:
  group: native-helper-source-publication
  cancel-in-progress: false
jobs:
  publish-exact-tested-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Publish only the exact freshly verified repair tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = GuDuYunChen/Local-Notepad
          test "$GITHUB_REF" = refs/heads/fix/native-helper-lifecycle-4-248
          baseline=8538e3f41729f245721ef6dff531c6431182a14d
          expected_tree=9fcb62bd1a865782cabe28d39dcf6baafa5910bf
          patch="$RUNNER_TEMP/native-helper-reviewed.patch"
          cat .github/automation/native-helper-part-{1,2,3,4}.diff > "$patch"
          printf '%s  %s\n' e8d0cb69ac73f5f7c85af5787d9757cdae3312c2a17d2423cbc5a50d9c735e05 "$patch" | sha256sum -c -
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$baseline"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$baseline"
          test "$(git rev-parse "$baseline^{tree}")" = d0a9f8eea51db5eb546361be161e595e56901f95
          git read-tree --reset -u "$baseline"
          git apply --check --index "$patch"
          git apply --index "$patch"
          git diff --cached --check "$baseline"
          tree="$(git write-tree)"
          test "$tree" = "$expected_tree"
          test -z "$(git diff --cached --name-only "$baseline" -- src electron server package.json package-lock.json)"
          test ! -e .github/workflows/publish-native-helper.yml
          test ! -e .github/workflows/recover-native-helper-patch.yml
          test ! -e .github/automation/native-helper-part-1.diff
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Verified native helper repair'
          git config user.email 'native-helper-repair@users.noreply.github.com'
          candidate="$(printf '%s\n\n%s\n' 'fix: preserve actual native helper exit and pipe-closure evidence' 'Exact freshly verified tree9fcb62bd. Original startup/request/cleanup budgets and business assertions retained; process error is not exit and exit is not pipe closure. Current complete default5919/UI2224/Electron657/Go2344 and728 retained contracts/builds passed with no failures/skips. Verifier-only: product4.248.0 and src/electron/server/lock/schema unchanged. Current Windows helper and packaged acceptance and final review remain required. No acceptance/merge claim. Temporary transport files excluded; normal descendant; no main/master update or branch deletion.' | git commit-tree "$tree" -p "$GITHUB_SHA")"
          git push origin "$candidate:$GITHUB_REF"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$candidate"
          printf '{"sourceCommit":"%s","sourceTree":"%s","publicationCommit":"%s","baseline":"%s","windowsAcceptance":false,"merged":false}\n' "$candidate" "$tree" "$GITHUB_SHA" "$baseline" > "$RUNNER_TEMP/native-helper-publication.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-helper-source-publication
          path: ${{ runner.temp }}/native-helper-publication.json
          if-no-files-found: error
          retention-days: 14
