name: Phase 454 source snapshot
on:
  push:
    branches: [feature/ui-redesign-v1]
    paths: [.github/workflows/phase454-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/phase454-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/phase454-sha.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/phase454-tree.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: phase454-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase454-source.tar.gz
            ${{ runner.temp }}/phase454-sha.txt
            ${{ runner.temp }}/phase454-tree.txt
          retention-days: 1
