name: 2F104 one-shot reproduction

on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/diagnostic-2f104-reproduction.yml]

# The last step may upload immutable Git blobs/trees after every candidate
# test passes. It NEVER changes a branch, creates a PR, or publishes a release.
permissions:
  contents: write

jobs:
  reproduce:
    if: github.head_ref == 'feature/local-draft-durability-2f104' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      CANDIDATE_BASE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Install the existing locked dependency graph
        run: |
          node scripts/verify-dependency-lock.mjs
          npm ci --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
          mkdir -p "$RUNNER_TEMP/notepad-candidate"
          echo "CANDIDATE_OUT=$RUNNER_TEMP/notepad-candidate" >> "$GITHUB_ENV"
      - name: Preserve and reproduce the original failure
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$CANDIDATE_OUT/original-commit.txt"
          git rev-parse HEAD^{tree} > "$CANDIDATE_OUT/original-tree.txt"
          node scripts/build-local-export-fixture.mjs
          set +e
          node --test scripts/block-references-evidence.node.mjs scripts/block-references-installed-evidence.node.mjs > "$CANDIDATE_OUT/original-failure.log" 2>&1
          result=$?
          set -e
          cat "$CANDIDATE_OUT/original-failure.log"
          test "$result" -eq 1
          grep -q 'reading-import-validator.mjs' "$CANDIDATE_OUT/original-failure.log"
          grep -q '4.236.0' "$CANDIDATE_OUT/original-failure.log"
      - name: Prepare an isolated release-binding candidate, not a remote source update
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import path from 'node:path'
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim()
          const files=git('ls-files','-z').split('\0').filter(Boolean)
          const original=new Map(files.filter(f=>f.startsWith('scripts/')&&/\.(mjs|cjs|js)$/.test(f)).map(f=>[f,readFileSync(f,'utf8')]))
          const blob=text=>createHash('sha1').update('blob '+Buffer.byteLength(text)+'\0').update(text).digest('hex')
          assert.equal(JSON.parse(readFileSync('package.json','utf8')).version,'4.237.0')
          const changes=[]
          for(const [file,before] of original){
            if(!before.includes('4.236.0'))continue
            const lines=before.split('\n').flatMap((line,i)=>line.includes('4.236.0')?[{line:i+1,text:line}]:[])
            console.log('RELEASE_BINDING_AUDIT '+JSON.stringify({file,lines}))
            const after=before.replaceAll('4.236.0','4.237.0')
            writeFileSync(file,after)
            changes.push({file,before:blob(before),after:blob(after)})
          }
          assert.ok(changes.some(c=>c.file==='scripts/reading-mode-installed-evidence.mjs'))
          // Only synthetic test source pins follow the reviewed version-only
          // changes. Historical templates and real installer JSON are untouched.
          for(const [file] of original){
            if(!/(?:\.node\.mjs|\.test\.js|test-fixture\.mjs)$/.test(file))continue
            let text=readFileSync(file,'utf8')
            for(const c of changes)text=text.replaceAll(c.before,c.after)
            writeFileSync(file,text)
          }
          const checker=String.raw`import { readFileSync } from 'node:fs'
          import path from 'node:path'
          import { fileURLToPath } from 'node:url'
          
          // Historical seed releases are deliberately not part of this list.
          // Every active runner, generated validator and synthetic release must
          // agree with the manifest BEFORE dependencies or packaging are run.
          export const ACCEPTANCE_VERSION_FIELDS = Object.freeze([
            ['scripts/reading-mode-desktop-evidence.mjs', "export const READING_MODE_VERSION = '"],
            ['scripts/shortcut-management-desktop-evidence.mjs', "export const SHORTCUT_MANAGEMENT_VERSION = '"],
            ['scripts/local-export-desktop-evidence.mjs', "export const LOCAL_EXPORT_VERSION = '"],
            ['scripts/block-references-evidence.mjs', "export const BLOCK_REFERENCE_VERSION = '"],
            ['scripts/reading-mode-installed-evidence.mjs', "assert.equal(pin.current?.version, '"],
            ['scripts/shortcut-management-installed-evidence.mjs', "assert.equal(pin.current.version, '"],
            ['scripts/local-import-desktop-evidence.mjs', "assert.equal(report.appVersion, '"],
            ['scripts/check-local-import-desktop.mjs', "assert.equal(diagnostics.version, '"],
            ['scripts/local-import-desktop-evidence.node.mjs', "appVersion: '"],
            ['scripts/reading-mode-installed-evidence.mjs', ", \"assert.equal(pin.current.version, '"],
            ['scripts/reading-mode-installed-evidence.mjs', ", \"assert.equal(report.appVersion, '"],
            ['scripts/reading-mode-installed-evidence.mjs', ", \"assert.equal(diagnostics.version, '"],
            ['scripts/reading-mode-installed-evidence.mjs', ", \"appVersion: '"],
          ])
          
          export function inspectAcceptanceVersions(read) {
            const errors = []
            let version
            try { version = JSON.parse(read('package.json')).version } catch { errors.push({ file: 'package.json', reason: 'unreadable-manifest' }) }
            if (typeof version !== 'string' || !/^\d+\.\d+\.\d+$/.test(version)) errors.push({ file: 'package.json', reason: 'invalid-release-version' })
            for (const [file, anchor] of ACCEPTANCE_VERSION_FIELDS) {
              let source
              try { source = read(file) } catch { errors.push({ file, anchor, reason: 'missing-source' }); continue }
              const matches = typeof source === 'string' ? source.split(anchor).slice(1) : []
              if (matches.length !== 1) { errors.push({ file, anchor, reason: 'missing-or-ambiguous-anchor', count: matches.length }); continue }
              const actual = matches[0].split("'")[0]
              if (actual !== version) errors.push({ file, anchor, expected: version, actual, reason: 'release-mismatch' })
            }
            return { version, checks: ACCEPTANCE_VERSION_FIELDS.length, valid: errors.length === 0, errors }
          }
          
          if (process.argv[1] && path.resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {
            const root = fileURLToPath(new URL('../', import.meta.url))
            const result = inspectAcceptanceVersions(file => readFileSync(path.join(root, file), 'utf8'))
            console.log(JSON.stringify(result, null, 2))
            if (!result.valid) process.exitCode = 1
          }
          `
          writeFileSync('scripts/check-acceptance-versions.mjs',checker)
          const tests=String.raw`import { readFileSync } from 'node:fs'
          import { describe, expect, it } from 'vitest'
          import { ACCEPTANCE_VERSION_FIELDS, inspectAcceptanceVersions } from '../../scripts/check-acceptance-versions.mjs'
          
          const read = file => readFileSync(new URL('../../' + file, import.meta.url), 'utf8')
          const release = JSON.parse(read('package.json')).version
          describe('complete acceptance release bindings', () => {
            it('checks every active runner and generated release against the manifest', () => {
              expect(inspectAcceptanceVersions(read)).toEqual({ version: release, checks: 13, valid: true, errors: [] })
            })
            it.each(ACCEPTANCE_VERSION_FIELDS)('rejects stale release in %s at %s', (file, anchor) => {
              const result = inspectAcceptanceVersions(name => name === file ? read(name).replace(anchor + release, anchor + '0.0.0') : read(name))
              expect(result.valid).toBe(false)
              expect(result.errors.some(error => error.file === file && error.anchor === anchor && error.reason === 'release-mismatch')).toBe(true)
            })
            it('reports multiple mismatches together rather than only the first', () => {
              const result = inspectAcceptanceVersions(file => file === 'package.json' ? JSON.stringify({ version: '0.0.0' }) : read(file))
              expect(result.errors.filter(error => error.reason === 'release-mismatch')).toHaveLength(13)
            })
            it('rejects a missing generated-version anchor', () => {
              const [file, anchor] = ACCEPTANCE_VERSION_FIELDS.at(-1)
              const result = inspectAcceptanceVersions(name => name === file ? read(name).replace(anchor, 'REMOVED') : read(name))
              expect(result.valid).toBe(false)
              expect(result.errors.some(error => error.reason === 'missing-or-ambiguous-anchor')).toBe(true)
            })
            it('rejects duplicate anchors and unavailable sources', () => {
              const [file, anchor] = ACCEPTANCE_VERSION_FIELDS[0]
              expect(inspectAcceptanceVersions(name => name === file ? read(name) + '\n' + anchor + release + "'" : read(name)).valid).toBe(false)
              expect(inspectAcceptanceVersions(name => { if (name === file) throw Error('missing'); return read(name) }).valid).toBe(false)
            })
            it('rejects invalid manifest versions', () => {
              expect(inspectAcceptanceVersions(file => file === 'package.json' ? JSON.stringify({ version: '4.x' }) : read(file)).valid).toBe(false)
            })
          })
          `
          writeFileSync('src/services/acceptanceVersions.test.js',tests)
          const workflow='.github/workflows/ui-redesign-ci.yml', before=readFileSync(workflow,'utf8')
          const anchor='      - name: Install locked dependencies\n'
          assert.equal(before.split(anchor).length,3)
          writeFileSync(workflow,before.replaceAll(anchor,'      - name: Verify complete acceptance release bindings\n        run: node scripts/check-acceptance-versions.mjs\n'+anchor))
          unlinkSync('.github/workflows/diagnostic-2f104-reproduction.yml')
          execFileSync('git',['add','-u'])
          execFileSync('git',['add','scripts/check-acceptance-versions.mjs','src/services/acceptanceVersions.test.js'])
          execFileSync('git',['-c','user.name=CI candidate verification','-c','user.email=ci-candidate@users.noreply.github.com','commit','-m','candidate: synchronize complete 2F104 acceptance release bindings'])
          writeFileSync(path.join(process.env.CANDIDATE_OUT,'candidate-tree.txt'),git('rev-parse','HEAD^{tree}')+'\n')
          writeFileSync(path.join(process.env.CANDIDATE_OUT,'candidate.patch'),execFileSync('git',['diff','HEAD^','HEAD','--binary']))
          console.log('CANDIDATE_TREE '+git('rev-parse','HEAD^{tree}'))
          console.log(execFileSync('git',['diff','HEAD^','HEAD','--stat'],{encoding:'utf8'}))
          NODE
      - name: Verify all release bindings and inherited installation contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-acceptance-versions.mjs
          node scripts/build-reading-mode-fixture.mjs
          node scripts/build-local-export-fixture.mjs
          mapfile -t tests < <(git ls-files 'scripts/reading-mode*.node.mjs' 'scripts/shortcut-management*.node.mjs' 'scripts/local-export*.node.mjs' 'scripts/block-references*.node.mjs' 'scripts/local-import-desktop-evidence.node.mjs')
          printf '%s\n' "${tests[@]}" > "$CANDIDATE_OUT/contract-roster.txt"
          node --test "${tests[@]}" 2>&1 | tee "$CANDIDATE_OUT/contracts.log"
      - name: Run the complete unfiltered Vitest suite on the frozen candidate
        run: npx vitest run --root=. --reporter=default --reporter=json --outputFile=${{ runner.temp }}/notepad-candidate/vitest.json
      - name: Run the original UI suite
        run: npm run test:ui
      - name: Run the original Electron suite
        run: npm run test:electron
      - name: Run the complete backend suite
        run: go -C server test ./...
      - name: Build the original main and renderer targets
        run: |
          npm run build:main
          npm run build:renderer
          git diff --exit-code
      - name: Upload only immutable verified candidate objects, never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import path from 'node:path'
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim()
          const out=process.env.CANDIDATE_OUT, base=process.env.CANDIDATE_BASE
          assert.match(base,/^[a-f0-9]{40}$/)
          assert.equal(process.env.GITHUB_REPOSITORY,'GuDuYunChen/Local-Notepad')
          const api=async(route,body)=>{
            const response=await fetch('https://api.github.com/repos/GuDuYunChen/Local-Notepad/'+route,{method:body?'POST':'GET',redirect:'error',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})})
            if(!response.ok)throw Error('Git object API refused '+route+' status '+response.status)
            return response.json()
          }
          const head=await api('git/ref/heads/feature/local-draft-durability-2f104')
          assert.equal(head.object.sha,base,'Concurrent branch change: do not upload the stale candidate')
          const original=await api('git/commits/'+base)
          assert.equal(original.tree.sha,readFileSync(path.join(out,'original-tree.txt'),'utf8').trim(),'PR merge tree differs from source branch')
          const names=git('diff','--name-status','HEAD^','HEAD').split('\n').map(line=>line.split('\t'))
          const entries=[]
          for(const [status,file] of names){
            assert.ok(['A','M','D'].includes(status),status)
            if(status==='D'){entries.push({path:file,mode:'100644',type:'blob',sha:null});continue}
            const expected=git('rev-parse','HEAD:'+file)
            const bytes=readFileSync(file)
            assert.ok(Buffer.from(bytes.toString('utf8')).equals(bytes),'Candidate must contain UTF-8 source only')
            const value=await api('git/blobs',{content:bytes.toString('base64'),encoding:'base64'})
            assert.equal(value.sha,expected)
            entries.push({path:file,mode:'100644',type:'blob',sha:value.sha})
          }
          const tree=await api('git/trees',{base_tree:original.tree.sha,tree:entries})
          assert.equal(tree.sha,readFileSync(path.join(out,'candidate-tree.txt'),'utf8').trim())
          const report={sourceHead:base,sourceTree:original.tree.sha,testedTree:tree.sha,remoteTree:tree.sha,branchUpdated:false,windowsVerified:false,moduleAccepted:false,entries}
          writeFileSync(path.join(out,'verified-candidate.json'),JSON.stringify(report,null,2))
          console.log('VERIFIED_IMMUTABLE_CANDIDATE '+JSON.stringify(report))
          NODE
      - name: Upload bounded candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-2f104-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/notepad-candidate/
          if-no-files-found: error
          retention-days: 7
