name: Import frozen local actions candidate 2F110
on:
  push:
    branches: [feature/local-actions-2f110]
    paths:
      - .github/workflows/import-local-actions-2f110.yml
      - .github/local-actions-2f110/**
permissions:
  contents: write
concurrency:
  group: import-frozen-local-actions-2f110
  cancel-in-progress: false
jobs:
  import-reviewed-tree:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/feature/local-actions-2f110'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify and publish only the exact tested source
        shell: bash
        env:
          GIT_AUTHOR_NAME: Local actions candidate import
          GIT_AUTHOR_EMAIL: candidate-import@users.noreply.github.com
          GIT_COMMITTER_NAME: Local actions candidate import
          GIT_COMMITTER_EMAIL: candidate-import@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          BASE='bf5f0ed5cb4cad4a1f1b0f874a87fa093b47f6e4'
          BASE_TREE='23d22c72321747b1314b418082bc453276f83ec0'
          TREE='4940e5b59d51cdc31b534ae59a2e34f825caceb0'
          REF='refs/heads/feature/local-actions-2f110'
          def git(*a,data=None):return subprocess.check_output(['git',*a],input=data).decode().strip()
          def require(ok,message):
              if not ok:raise RuntimeError(message)
          head=os.environ['GITHUB_SHA']
          require(git('rev-parse','HEAD')==head,'Wrong checkout')
          require(git('rev-parse','HEAD^')==BASE,'Unexpected parent')
          require(git('rev-parse',BASE+'^{tree}')==BASE_TREE,'Wrong accepted baseline')
          paths={'.github/workflows/import-local-actions-2f110.yml'}|{f'.github/local-actions-2f110/part{i}.txt' for i in (1,2)}
          require(set(git('diff','--name-only',BASE,head).splitlines())==paths,'Unreviewed transport changes')
          parts=[pathlib.Path(f'.github/local-actions-2f110/part{i}.txt').read_bytes() for i in (1,2)]
          require([len(p) for p in parts]==[14448,14444],'Incomplete payload')
          compressed=base64.b64decode(b''.join(parts),validate=True)
          require(len(compressed)==21668 and hashlib.sha256(compressed).hexdigest()=='19fc0c07f9eb6d6512388f40f9b2ef69eb4f2335aa2ab85933783252a03e4286','Payload mismatch')
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          patch=decoder.decompress(compressed,max_length=84212)
          require(len(patch)==84211 and decoder.eof and not decoder.unused_data,'Unexpected patch extent')
          require(hashlib.sha256(patch).hexdigest()=='ed08313fd1dba9e1f03a844855c548bebda625455aa49285768d8bcd4abf0021','Patch digest mismatch')
          require(git('ls-remote','origin','refs/heads/master').split()[0]==BASE,'Master changed; review first')
          require(git('ls-remote','origin',REF).split()[0]==head,'Feature changed')
          git('read-tree',BASE);git('apply','--cached','--binary','-',data=patch)
          require(git('write-tree')==TREE,'Not the tested tree')
          message=('feat: complete local quick actions panel 2F.110 / 4.243.0\n\n'
                   'Publish exact tested tree4940e5b59d51cdc31b534ae59a2e34f825caceb0. '
                   'Persistent sidebar/settings entry,17 allowlisted existing local destinations,literal search/category and keyboard selection, '
                   'original guarded navigation/save/discard/cancel,one-shot settings launch,overlay ownership,IME isolation, '
                   'cancellation,stale callbacks,explicit retry and focus restoration. No new body-write channel,schema or cloud feature. '
                   'Actual full unfiltered Vitest332 files/5469 pass,0fail/skip; originalUI/Electron/fullGo1.24.11/main/renderer builds pass. '
                   '183 inherited installation contracts and13 release bindings pass; six protected sources and679 dependency nodes unchanged. '
                   'Current productCI,new Windows installer and complete native/install verification remain required. '
                   'Transport is not acceptance and is absent from final source.\n')
          commit=git('commit-tree',TREE,'-p',head,data=message.encode())
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'local-actions-2f110-import';out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),commit],check=True)
          (out/'source-manifest.txt').write_text(git('ls-tree','-r',commit)+'\n')
          report={'baseline':BASE,'bootstrap':head,'commit':commit,'tree':TREE,'branch':REF,'sourceArchiveSHA256':hashlib.sha256((out/'source.tar.gz').read_bytes()).hexdigest(),'branchUpdated':False,'nativeAccepted':False}
          (out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          require(git('ls-remote','origin',REF).split()[0]==head,'Concurrent feature update')
          subprocess.run(['git','push','origin',commit+':'+REF],check=True)
          require(git('ls-remote','origin',REF).split()[0]==commit,'Published branch mismatch')
          report['branchUpdated']=True;(out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          PY
      - name: Preserve exact source and import receipt, not acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-actions-2f110-source-${{ github.sha }}
          path: ${{ runner.temp }}/local-actions-2f110-import/
          if-no-files-found: warn
          retention-days: 7
