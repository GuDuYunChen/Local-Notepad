name: Import frozen attachment audit candidate 2F108
on:
  push:
    branches: [feature/local-attachment-audit-2f108]
    paths:
      - .github/workflows/import-attachment-audit-2f108.yml
      - .github/attachment-audit-2f108/**
permissions:
  contents: write
concurrency:
  group: import-frozen-attachment-audit-2f108
  cancel-in-progress: false
jobs:
  import-reviewed-tree:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/feature/local-attachment-audit-2f108'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify and publish the exact locally tested tree
        shell: bash
        env:
          GIT_AUTHOR_NAME: Attachment audit candidate import
          GIT_AUTHOR_EMAIL: candidate-import@users.noreply.github.com
          GIT_COMMITTER_NAME: Attachment audit candidate import
          GIT_COMMITTER_EMAIL: candidate-import@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          BASE='21f987b4a8219d5dfc286ea6aed850ad7694292b'
          BASE_TREE='d94148952c1dd38110253535533f20e65b7dd761'
          TREE='f600aa7ffd3be0aad5fdee639dcee966a65d5689'
          REF='refs/heads/feature/local-attachment-audit-2f108'
          def git(*a,data=None): return subprocess.check_output(['git',*a],input=data).decode().strip()
          def require(ok,message):
              if not ok: raise RuntimeError(message)
          head=os.environ['GITHUB_SHA']
          require(git('rev-parse','HEAD')==head,'Wrong checkout')
          require(git('rev-parse','HEAD^')==BASE,'Unexpected parent')
          require(git('rev-parse',BASE+'^{tree}')==BASE_TREE,'Wrong baseline')
          paths={'.github/workflows/import-attachment-audit-2f108.yml'}|{f'.github/attachment-audit-2f108/part{i}.txt' for i in (1,2,3,4)}
          require(set(git('diff','--name-only',BASE,head).splitlines())==paths,'Unreviewed bootstrap changes')
          parts=[pathlib.Path(f'.github/attachment-audit-2f108/part{i}.txt').read_bytes() for i in (1,2,3,4)]
          require([len(p) for p in parts]==[12000,12000,12000,3532],'Incomplete payload')
          compressed=base64.b64decode(b''.join(parts),validate=True)
          require(len(compressed)==29648 and hashlib.sha256(compressed).hexdigest()=='563e69f1acbc5f1d3cd389d66109cdc6d68317dea751f39a5fc7dd4ee4133df7','Payload mismatch')
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          patch=decoder.decompress(compressed,max_length=113424)
          require(len(patch)==113423 and decoder.eof and not decoder.unused_data,'Unexpected patch extent')
          require(hashlib.sha256(patch).hexdigest()=='489038f91f8739a71ea57936104ca3a97f79634e9bd8cc9c6fb33e4432e0b714','Patch digest mismatch')
          require(git('ls-remote','origin','refs/heads/master').split()[0]==BASE,'Master changed; review first')
          require(git('ls-remote','origin',REF).split()[0]==head,'Feature changed')
          git('read-tree',BASE);git('apply','--cached','--binary','-',data=patch)
          require(git('write-tree')==TREE,'Not the tested tree')
          message=('feat: complete read-only attachment audit workspace 2F.108 / 4.241.0\n\n'
                   'Exact locally tested tree f600aa7ffd3be0aad5fdee639dcee966a65d5689. '
                   'Settings entry, bounded metadata inventory with directory drift checks, conservative saved-note/template/trash URL candidates, '
                   'missing/unreferenced/blocked classification, parser coverage gaps, filtering and both item/source pagination, '
                   'guarded source navigation, explicitly confirmed privacy-tiered JSON export, cancellation, stale refusal and retry. '
                   'Never delete attachments, open attachment content or write note bodies; unreferenced is not safe-to-delete. '
                   'Full unfiltered Vitest325 files/5347 passed,0failed/skipped; originalUI1652/Electron657/Go1.24.11/main/renderer builds passed. '
                   '183 installation contracts and13 active release bindings pass; protected save/draft/quit bytes, schema14 and679 locked dependencies unchanged. '
                   'Current productCI and actual Windows/new-installer acceptance remain required. Transport is not acceptance and is absent from final tree.\n')
          commit=git('commit-tree',TREE,'-p',head,data=message.encode())
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'attachment-audit-2f108-import';out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),commit],check=True)
          (out/'source-manifest.txt').write_text(git('ls-tree','-r',commit)+'\n')
          report={'baseline':BASE,'bootstrap':head,'commit':commit,'tree':TREE,'branch':REF,'sourceArchiveSHA256':hashlib.sha256((out/'source.tar.gz').read_bytes()).hexdigest(),'branchUpdated':False,'nativeAccepted':False}
          (out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          require(git('ls-remote','origin',REF).split()[0]==head,'Concurrent feature update')
          subprocess.run(['git','push','origin',commit+':'+REF],check=True)
          require(git('ls-remote','origin',REF).split()[0]==commit,'Published branch mismatch')
          report['branchUpdated']=True;(out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          PY
      - name: Preserve exact source and transport receipt, not native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-attachment-audit-2f108-source-${{ github.sha }}
          path: ${{ runner.temp }}/attachment-audit-2f108-import/
          if-no-files-found: warn
          retention-days: 7
