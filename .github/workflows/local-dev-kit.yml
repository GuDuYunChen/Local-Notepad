name: Publish verified block-reference source objects
on:
  push:
    branches: [ci/local-dev-kit-ac791496]
    paths: [.github/workflows/local-dev-kit.yml]
permissions:
  contents: write
concurrency:
  group: local-dev-kit-ac791496
  cancel-in-progress: false
jobs:
  publish-fixed-source-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publisher inputs
        uses: actions/checkout@v7
        with:
          path: publisher
          persist-credentials: false
      - name: Checkout exact accepted product base
        uses: actions/checkout@v7
        with:
          ref: ac7914962242fcab16a14125ce3ea353e331b6ef
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact patch and create immutable source objects only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node publisher/.github/scripts/publish-block-source.mjs
      - name: Retain immutable-source receipt
        uses: actions/upload-artifact@v4
        with:
          name: verified-block-source-objects
          path: source-object-receipt/immutable-source-objects.json
          retention-days: 30
          if-no-files-found: error
