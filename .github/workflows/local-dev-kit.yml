name: Fixed PR9 source delta for local verification
on:
  push:
    branches: [ci/local-dev-kit-ac791496]
    paths: [.github/workflows/local-dev-kit.yml]
permissions:
  contents: read
concurrency:
  group: local-dev-kit-ac791496
  cancel-in-progress: false
jobs:
  export-fixed-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4c5dff10780907d515b5f3d8f5c5bb2cd205184a
          persist-credentials: false
      - name: Export source difference without changing product refs
        shell: bash
        run: |
          set -euo pipefail
          base=ac7914962242fcab16a14125ce3ea353e331b6ef
          head=4c5dff10780907d515b5f3d8f5c5bb2cd205184a
          test "$(git rev-parse HEAD)" = "$head"
          git fetch --no-tags --depth=1 origin "$base"
          test "$(git rev-parse "$base^{tree}")" = 2caa3ab98c8118f68d0ebb4d0f2e51b4e6abfb4e
          out="$RUNNER_TEMP/pr9-source-delta"
          mkdir -p "$out"
          git diff --binary "$base" "$head" > "$out/candidate.patch"
          git cat-file commit "$head" > "$out/candidate-commit.raw"
          git ls-tree -r -z "$head" > "$out/candidate-tree.zlist"
          git rev-parse "$head^{tree}" > "$out/candidate-tree.txt"
          (cd "$out" && sha256sum candidate.* candidate-* > SHA256SUMS)
          wc -c "$out"/*
      - uses: actions/upload-artifact@v4
        with:
          name: pr9-source-delta-4c5dff1
          path: ${{ runner.temp }}/pr9-source-delta/*
          retention-days: 7
          if-no-files-found: error
