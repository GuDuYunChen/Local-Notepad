name: Actual local template installation lifecycle 2F89
on:
  push:
    branches: [ci/local-installation-2f86]
permissions:
  contents: read
  actions: read
concurrency:
  group: local-installation-2f86
  cancel-in-progress: false
jobs:
  install-upgrade-uninstall:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify historical issue catalog and locked dependencies
        shell: pwsh
        run: |
          node scripts/stage-review.mjs catalog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-dependency-lock.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact verifier dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure lock was not modified
        run: git diff --exit-code -- package.json package-lock.json
      - name: Download accepted 4.221.1 upgrade seed
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38494623807
          name: local-notepad-windows-d002c8870af32eee85c4730e2db1d240a93f118a
          path: .installer-input/previous
      - name: Download unchanged old path-failure counterexample
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38337004784
          name: local-notepad-windows-191439e04ddbf6b4423194d2978ae72da926df3c
          path: .installer-input/legacy
      - name: Download source-bound 4.222.3 installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38542237280
          name: local-notepad-windows-6100a3522e875bf4247bcc48a6742f4f2c97a3a9
          path: .installer-input/current
      - name: Pin verified final product without changing any test assertions
        run: node scripts/pin-template-final-installer.mjs
      - name: Prepare original installer harness with unchanged native modules
        run: node scripts/run-template-installer.mjs prepare
      - name: Retain all existing refusal tests and new daily evidence checks
        run: node --test scripts/installer-lifecycle-core.node.mjs scripts/installer-shell-core.node.mjs scripts/history-installation-evidence.node.mjs scripts/daily-installed-evidence.node.mjs scripts/template-installed-evidence.node.mjs
      - name: Actual install templates daily history trash upgrade reinstall uninstall and data retention
        run: node scripts/run-template-installer.mjs run
      - name: Retain complete or failed original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-install-lifecycle-${{ github.sha }}
          path: test-results/installer-lifecycle/
          if-no-files-found: error
          retention-days: 14
