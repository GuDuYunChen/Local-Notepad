name: Actual local backlinks installation lifecycle 2F92
on:
  push:
    branches: [ci/local-installation-2f86]
permissions:
  contents: read
  actions: read
concurrency:
  group: local-installation-2f86
  cancel-in-progress: false
jobs:
  install-upgrade-uninstall:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify historical issue catalog and locked dependencies
        shell: pwsh
        run: |
          node scripts/stage-review.mjs catalog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-dependency-lock.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact verifier dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure lock was not modified
        run: git diff --exit-code -- package.json package-lock.json
      - name: Download accepted 4.224.0 upgrade seed
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38666413219
          name: local-notepad-windows-8925c2097e74ce6720dc29b3c2ddd1b5038c3fc5
          path: .installer-input/previous
      - name: Download unchanged old path-failure counterexample
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38337004784
          name: local-notepad-windows-191439e04ddbf6b4423194d2978ae72da926df3c
          path: .installer-input/legacy
      - name: Download source-bound 4.225.0 installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38677130286
          name: local-notepad-windows-30ba71615682ef9ee06cacca18620ca9efea0576
          path: .installer-input/current
      - name: Verify exact current and upgrade binary identities
        run: node scripts/pin-backlinks-installer.mjs
      - name: Preserve original lifecycle and add exact native backlink workflow
        run: node scripts/run-backlinks-installer.mjs prepare
      - name: Retain all original refusal checks and backlink evidence contracts
        run: node --test scripts/installer-lifecycle-core.node.mjs scripts/installer-shell-core.node.mjs scripts/history-installation-evidence.node.mjs scripts/daily-installed-evidence.node.mjs scripts/template-installed-evidence.node.mjs scripts/quick-installed-evidence.node.mjs scripts/note-tags-installed-evidence.node.mjs scripts/backlinks-installed-evidence.node.mjs
      - name: Actual installed modules upgrade overwrite uninstall reinstall and data retention
        run: node scripts/run-backlinks-installer.mjs run
      - name: Retain complete or failed original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-install-lifecycle-${{ github.sha }}
          path: test-results/installer-lifecycle/
          if-no-files-found: error
          retention-days: 14
