name: Actual local document export installation lifecycle 2F102
on:
  push:
    branches: [ci/local-installation-2f86]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: local-installation-2f86
  cancel-in-progress: false
jobs:
  install-upgrade-uninstall:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify historical issue catalog and locked dependencies
        shell: pwsh
        run: |
          node scripts/stage-review.mjs catalog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-dependency-lock.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact verifier dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure lock was not modified
        run: git diff --exit-code -- package.json package-lock.json
      - name: Build canonical reading fixture before refusal contracts
        run: node scripts/build-reading-mode-fixture.mjs
      - name: Build canonical local export fixture before added refusal contracts
        run: node scripts/build-local-export-fixture.mjs
      - name: Refuse missing reading and shortcut gates and prove complete original preparation
        shell: pwsh
        run: |
          node -e "const fs = require('node:fs'); const out = 'test-results/installer-lifecycle'; fs.mkdirSync(out, { recursive: true }); fs.writeFileSync(out + '/preparation-context.json', JSON.stringify({ schemaVersion: 1, scope: 'installer-preparation-contracts-only', nativeLifecycleExecuted: false, verifierCommit: process.env.GITHUB_SHA ?? null, runID: process.env.GITHUB_RUN_ID ?? null, runAttempt: process.env.GITHUB_RUN_ATTEMPT ?? null, job: process.env.GITHUB_JOB ?? null, platform: process.platform, node: process.version, startedAt: new Date().toISOString() }, null, 2) + '\n', { flag: 'wx' })"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-reporter=tap --test-reporter-destination=test-results/installer-lifecycle/preparation-contracts.tap scripts/reading-mode-desktop-evidence.node.mjs scripts/reading-mode-installed-evidence.node.mjs scripts/reading-mode-native-input.node.mjs scripts/desktop-window-session.node.mjs scripts/shortcut-management-desktop-evidence.node.mjs scripts/shortcut-management-installed-evidence.node.mjs
      - name: Add source-bound export preparation and file evidence contracts
        run: node --test --test-reporter=tap --test-reporter-destination=test-results/installer-lifecycle/local-export-preparation-contracts.tap scripts/local-export-desktop-evidence.node.mjs scripts/local-export-installed-evidence.node.mjs
      - name: Verify block reference boundaries and preserved installed lifecycle
        run: node --test --test-reporter=tap --test-reporter-destination=test-results/installer-lifecycle/block-reference-preparation-contracts.tap scripts/block-references-evidence.node.mjs scripts/block-references-installed-evidence.node.mjs
      - name: Verify fixed legacy installer restoration and refusals
        run: node --test scripts/prepare-legacy-installer.node.mjs
      - name: Resolve only complete source and binary pins
        id: reading-pin
        run: node scripts/pin-reading-mode-installer.mjs outputs
      - name: Verify exact artifact IDs against original run and product metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pin-reading-mode-installer.mjs verify-artifacts
      - name: Download accepted 4.232.0 upgrade seed
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.reading-pin.outputs.previous-run }}
          name: ${{ steps.reading-pin.outputs.previous-name }}
          path: .installer-input/previous
      - name: Restore unchanged old path-failure counterexample
        run: node scripts/prepare-legacy-installer.mjs
      - name: Download source-bound 4.249.0 installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.reading-pin.outputs.current-run }}
          name: ${{ steps.reading-pin.outputs.current-name }}
          path: .installer-input/current
      - name: Verify exact current and upgrade binary identities
        run: node scripts/pin-reading-mode-installer.mjs prepare
      - name: Verify canonical reading fixture from the prepared serializer
        run: node --test scripts/reading-mode-desktop-fixture.node.mjs
      - name: Preserve original lifecycle and all modules plus native reading and shortcut workflows
        run: node scripts/run-reading-mode-installer.mjs prepare
      - name: Retain all original refusal checks and add import evidence contracts
        run: node --test scripts/installer-lifecycle-core.node.mjs scripts/installer-shell-core.node.mjs scripts/history-installation-evidence.node.mjs scripts/daily-installed-evidence.node.mjs scripts/template-installed-evidence.node.mjs scripts/quick-installed-evidence.node.mjs scripts/note-tags-installed-evidence.node.mjs scripts/backlinks-installed-evidence.node.mjs scripts/document-search-installed-evidence.node.mjs scripts/document-outline-installed-evidence.node.mjs scripts/local-graph-installed-evidence.node.mjs scripts/local-pins-installed-evidence.node.mjs scripts/recent-notes-installed-evidence.node.mjs scripts/installer-history-readiness.node.mjs scripts/wiki-installed-evidence.node.mjs scripts/local-import-desktop-evidence.node.mjs scripts/local-import-installed-evidence.node.mjs
      - name: Apply unchanged import refusal contracts to generated target-version validator
        run: node --test scripts/reading-import-desktop-validator.node.mjs
      - name: Actual installed modules upgrade overwrite uninstall reinstall and data retention
        run: node scripts/run-reading-mode-installer.mjs run
      # Add after the existing "Actual installed modules upgrade overwrite uninstall
      # reinstall and data retention" step and before its existing always-upload.
      # No original lifecycle command, pin, inverse proof or gate is replaced.
      - name: Verify the three original UI screens in the current installed application
        shell: pwsh
        run: |
          node --test scripts/ui-screens-evidence.node.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-ui-screens-installed.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain complete or failed original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-install-lifecycle-${{ github.sha }}
          path: test-results/installer-lifecycle/
          if-no-files-found: error
          retention-days: 14
  # Merge ONLY these additional jobs under the existing workflow's jobs mapping.
  # The existing install-upgrade-uninstall job keeps its timeout-minutes: 20,
  # every original step, and the separately reviewed original-three-page step.
  # These groups begin only AFTER that job (including all 12 three-page scenes)
  # succeeds. Each group gets a DIFFERENT hosted runner and independent data baseline.
  full-application-ui:
    name: Actual application UI / ${{ matrix.group }}
    needs: install-upgrade-uninstall
    runs-on: windows-latest
    # Settings has 720 native scenes and a five-second real sync polling cycle.
    # Only the hosted-job wall-clock limit increases; all native scene, keyboard,
    # screenshot, per-assertion waiting and rejection budgets remain unchanged.
    timeout-minutes: ${{ matrix.group == 'settings' && 50 || 25 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [settings, projects, research, editor, local-sync-lab]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fetch approved immutable PR merge object for source identity checks.
      # Verifier checkout history cannot resolve the synthetic merge SHA.
      - name: Fetch and verify accepted product merge object for app matrices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw -LiteralPath scripts/reading-mode-installer-pin.json | ConvertFrom-Json
          $ledger = Get-Content -Raw -LiteralPath scripts/full-app-ui-routes.json | ConvertFrom-Json
          $expected = [string]$pin.product
          if ($expected -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid product commit pin' }
          git fetch --no-tags origin refs/pull/29/merge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git rev-parse --verify FETCH_HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne $expected) { throw 'Current PR merge has changed from accepted product commit' }
          $productTree = (git rev-parse --verify "$expected^{tree}").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($productTree -cne [string]$ledger.productSource.tree) { throw 'Accepted product tree changed' }
          if ((git rev-parse --verify HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Verifier HEAD changed' }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use the product Go version for exact record-byte contracts
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'
          cache: false
      - name: Verify the unchanged dependency lock
        run: node scripts/verify-dependency-lock.mjs
      - name: Install exact verifier dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure package inputs were not modified
        run: git diff --exit-code -- package.json package-lock.json
      - name: Download the preceding original installed acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: local-notepad-install-lifecycle-${{ github.sha }}
          path: .accepted-installation
      # The pin reader imports original source validators; their ESM imports
      # require both canonical desktop fixture bundles even for `outputs`.
      # Build before resolving pins, without altering any acceptance assertions.
      - name: Build canonical fixtures before the source-bound pin reader
        shell: pwsh
        run: |
          node scripts/build-reading-mode-fixture.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-local-export-fixture.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve the exact existing binary and source pin
        id: reading-pin
        run: node scripts/pin-reading-mode-installer.mjs outputs
      - name: Verify current and retained historical artifact identities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pin-reading-mode-installer.mjs verify-artifacts
      - name: Download the exact accepted old installer for original source preparation
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.reading-pin.outputs.previous-run }}
          name: ${{ steps.reading-pin.outputs.previous-name }}
          path: .installer-input/previous
      - name: Download the same accepted current installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.reading-pin.outputs.current-run }}
          name: ${{ steps.reading-pin.outputs.current-name }}
          path: .installer-input/current
      - name: Reproduce the original verified serializer and lifecycle source preparation
        shell: pwsh
        run: |
          node scripts/build-reading-mode-fixture.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-local-export-fixture.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/pin-reading-mode-installer.mjs prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-reading-mode-installer.mjs prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Refuse incomplete routes, screenshots, native bounds and cross-runner identity claims
        run: node --test scripts/full-app-ui-evidence.node.mjs scripts/full-app-ui-shared.node.mjs scripts/full-app-ui-local-sync-seed.node.mjs
      - name: Fresh install and actual application page matrix
        run: node scripts/run-full-app-ui-installed.mjs ${{ matrix.group }}
      - name: Retain successful or failed page-matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-full-app-ui-${{ matrix.group }}-${{ github.sha }}
          path: |
            test-results/full-app-ui/${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 14

  full-application-ui-acceptance:
    name: Validate the complete actual application matrix
    needs: [install-upgrade-uninstall, full-application-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: local-notepad-full-app-ui-settings-${{ github.sha }}
          path: test-results/full-app-ui/settings
      - uses: actions/download-artifact@v4
        with:
          name: local-notepad-full-app-ui-projects-${{ github.sha }}
          path: test-results/full-app-ui/projects
      - uses: actions/download-artifact@v4
        with:
          name: local-notepad-full-app-ui-research-${{ github.sha }}
          path: test-results/full-app-ui/research
      - uses: actions/download-artifact@v4
        with:
          name: local-notepad-full-app-ui-editor-${{ github.sha }}
          path: test-results/full-app-ui/editor
      - uses: actions/download-artifact@v4
        with:
          name: local-notepad-full-app-ui-local-sync-lab-${{ github.sha }}
          path: test-results/full-app-ui/local-sync-lab
      - name: Require all original prerequisites, all groups, and zero unmapped pages
        run: node scripts/full-app-ui-evidence.mjs aggregate
      - name: Retain the aggregate receipt without replacing original artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-full-app-ui-accepted-${{ github.sha }}
          path: test-results/full-app-ui/full-app-ui-accepted.json
          if-no-files-found: error
          retention-days: 14
