name: History Review Source
on:
  push:
    branches: [feature/knowledge-os-phase2]
    paths: [.github/workflows/history-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bc5e93cf75ece88ca258d5bd1c2988471bff1a35
      - name: Archive only tracked accepted sources
        run: |
          mkdir -p /tmp/history-review-source
          git archive --format=zip HEAD > /tmp/history-review-source/source.zip
          git rev-parse HEAD > /tmp/history-review-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/history-review-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-history-source-bc5e93c
          path: /tmp/history-review-source/*
          retention-days: 7
          if-no-files-found: error
