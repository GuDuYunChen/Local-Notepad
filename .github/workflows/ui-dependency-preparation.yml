name: UI dependency preparation
on:
  push:
    branches: [fix/local-ui-consistency-2f116]
    paths: [.github/workflows/ui-dependency-preparation.yml]
permissions:
  contents: read
jobs:
  locked-ui-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1c8ec5689847a580ce307b9157fbbc8c1ac43a8f
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate deliberate dependency update then verify with npm ci
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-dependency
          cp package-lock.json ui-dependency/baseline-package-lock.json
          npm install --package-lock-only --ignore-scripts --save-exact antd@6.6.8 --no-audit --no-fund
          npm ci --no-audit --no-fund
          git diff -- package.json package-lock.json > ui-dependency/dependency.patch
          cp package.json package-lock.json ui-dependency/
          node -e "const p=require('./node_modules/antd/package.json'); if(p.version!=='6.6.8')throw Error('Wrong UI library'); console.log(JSON.stringify({node:process.version,antd:p.version,react:require('./node_modules/react/package.json').version,source:'1c8ec5689847a580ce307b9157fbbc8c1ac43a8f',run:process.env.GITHUB_RUN_ID}))" > ui-dependency/provenance.json
          tar -czf ui-dependency/node-modules.tar.gz node_modules
          (cd ui-dependency && sha256sum baseline-package-lock.json dependency.patch package.json package-lock.json provenance.json node-modules.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ui-locked-antd-6-6-8
          path: ui-dependency/
          retention-days: 7
          if-no-files-found: error
