name: Complete local recent-note history verification
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Review inherited issue and regression index
        run: node scripts/stage-review.mjs catalog
      - name: Integrate complete source-bound module and explicit minor version
        run: node scripts/prepare-recent-notes-2f97.mjs apply
      - name: Install only committed locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Recent history and all prior pin draft save quit guards
        run: node --test scripts/recent-notes.node.mjs scripts/local-pins.node.mjs scripts/pin-journal-boundaries.node.mjs scripts/pin-recovery-ownership.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs > recent-module-evidence/node-contracts.tap
      - name: Mounted recent panel tracking hook and storage boundaries
        run: npx vitest run --root=. src/components/RecentNotesPanel.test.jsx src/hooks/useRecentNoteTracking.test.jsx src/services/recentNotes.test.js --reporter=json --outputFile=recent-module-evidence/targeted.json
      - name: Full original UI regression including latest recent history
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=recent-module-evidence/full-ui.json
      - name: Unchanged production Go regression
        run: go -C server test -json ./... > recent-module-evidence/go-tests.jsonl
      - name: Full original main preload and renderer build
        run: npm run build:main && npm run build:renderer
      - name: Recheck all candidate identities after build
        run: node scripts/prepare-recent-notes-2f97.mjs verify
      - name: Publish only the tested changed code objects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-recent-notes-2f97.mjs publish
      - name: Retain complete or failed original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-notes-verification-${{ github.sha }}
          path: recent-module-evidence/
          retention-days: 7
          if-no-files-found: error
