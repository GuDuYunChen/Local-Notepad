name: Complete local Wiki preview and safe navigation
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact accepted App for negative controls
        run: git fetch --no-tags --depth=1 origin 7b937756425d3f8a95e33cec86bb8a5760776dcb
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Preserve historical issue and execution indexes
        run: node scripts/stage-review.mjs catalog
      - name: Integrate complete source-bound Wiki module and explicit version
        run: node scripts/prepare-wiki-navigation.mjs apply
      - name: Preserve real reference exports in the original discard fixture
        run: node scripts/repair-wiki-discard-fixture.mjs
      - name: Install exact committed dependency lock
        run: npm ci --no-audit --no-fund
      - name: Reproduce old App late-navigation and stale-draft failures
        run: node scripts/prepare-wiki-navigation.mjs baseline
      - name: Wiki source lifetime and all original recent pin save quit guards
        run: node --test --test-reporter=tap scripts/wiki-navigation.node.mjs scripts/recent-notes.node.mjs scripts/recent-reopen.node.mjs scripts/local-pins.node.mjs scripts/pin-journal-boundaries.node.mjs scripts/pin-recovery-ownership.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs > wiki-evidence/node.tap
      - name: Real App and Wiki preview lifecycle
        run: npx vitest run --root=. src/App.wikiNavigation.test.jsx src/components/Editor/nodes/WikiLinkView.test.jsx src/services/wikiNavigation.test.js --reporter=json --outputFile=wiki-evidence/targeted.json
      - name: Full unchanged UI regression and complete Wiki workflow
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=wiki-evidence/full-ui.json
      - name: Unchanged production Go regression
        run: go -C server test -json ./... > wiki-evidence/go-tests.jsonl
      - name: Full original main preload and renderer builds
        run: npm run build:main && npm run build:renderer
      - name: Recheck all final candidate identities
        run: node scripts/prepare-wiki-navigation.mjs check
      - name: Publish only verified changed code objects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-wiki-navigation.mjs publish
      - name: Preserve original complete or failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-navigation-${{ github.sha }}
          path: wiki-evidence/
          retention-days: 7
          if-no-files-found: error
