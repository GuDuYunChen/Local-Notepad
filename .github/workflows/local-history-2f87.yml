name: Verify outline cross-module search focus readiness
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Review original issue catalog and lock
        run: node scripts/stage-review.mjs catalog && node scripts/verify-dependency-lock.mjs
      - name: Apply exact test-only focus observation repair
        run: node scripts/repair-outline-search-focus.mjs apply
      - name: Install exact committed dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove original shortcut focus timing and safe target selection
        run: npx vitest run --root=. src/components/Editor/plugins/SearchPlugin.lifecycle.test.jsx src/components/Editor/plugins/OutlineSearch.integration.test.jsx --reporter=json --outputFile=outline-focus-evidence/targeted.json
      - name: Retain every original UI test
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=outline-focus-evidence/full-ui.json
      - name: Retain original search outline save and quit protections
        run: node --test scripts/document-outline.node.mjs scripts/document-search.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Build full original main preload and renderer
        run: npm run build:main && npm run build:renderer
      - name: Publish only two tested changed code objects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repair-outline-search-focus.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outline-focus-${{ github.sha }}
          path: outline-focus-evidence/
          retention-days: 7
          if-no-files-found: error
