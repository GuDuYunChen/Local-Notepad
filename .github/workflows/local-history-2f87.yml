name: Verify complete local backlinks and source navigation
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact accepted component for negative controls
        run: git fetch --no-tags --depth=1 origin 8925c2097e74ce6720dc29b3c2ddd1b5038c3fc5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Review inherited incidents and normal minor version
        run: node scripts/stage-review.mjs catalog && node scripts/prepare-backlinks-2f92.mjs prepare
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reproduce original silent error and invalid source navigation
        run: node scripts/prepare-backlinks-2f92.mjs baseline
      - name: Backlinks core and original save protection
        run: node --test scripts/backlink-sources.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Full original UI plus backlinks and original navigation guard
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=default --reporter=json --outputFile=backlink-module-evidence/full-ui.json
      - name: Complete production Go SQLite tests and bounded source reads
        run: |
          go -C server test -json ./... > backlink-module-evidence/go-tests.jsonl
          go -C server test -race ./internal/dao -run BacklinkSnapshot -count=1
      - name: Complete original main preload and renderer build
        run: npm run build:main && npm run build:renderer
      - name: Publish tested changed code objects only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-backlinks-2f92.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backlinks-verification-${{ github.sha }}
          path: backlink-module-evidence/
          retention-days: 7
          if-no-files-found: error
