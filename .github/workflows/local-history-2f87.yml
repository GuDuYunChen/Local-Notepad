name: Verify outline and search foreground integration
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Review historical issue catalog and lock
        run: node scripts/stage-review.mjs catalog && node scripts/verify-dependency-lock.mjs
      - name: Install exact committed dependencies
        run: npm ci --no-audit --no-fund
      - name: Reproduce current outline foreground regression
        run: node scripts/repair-outline-foreground.mjs baseline
      - name: Apply source-guarded foreground fix and normal patch version
        run: node scripts/repair-outline-foreground.mjs apply
      - name: Actual outline search integration and original lifecycle contracts
        run: npx vitest run --root=. src/components/Editor/plugins/OutlineSearch.integration.test.jsx src/components/Editor/plugins/DocumentOutline.lifecycle.test.jsx src/components/Editor/plugins/SearchPlugin.lifecycle.test.jsx --reporter=json --outputFile=outline-foreground-evidence/targeted.json
      - name: All original UI regression tests
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=outline-foreground-evidence/full-ui.json
      - name: Preserve original outline search save and quit protections
        run: node --test scripts/document-outline.node.mjs scripts/document-search.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Build original full main preload and renderer
        run: npm run build:main && npm run build:renderer
      - name: Publish only tested changed code objects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repair-outline-foreground.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outline-foreground-${{ github.sha }}
          path: outline-foreground-evidence/
          retention-days: 7
          if-no-files-found: error
