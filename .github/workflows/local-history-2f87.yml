name: Verify complete local pinned-note organization
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the exact accepted negative-control source
        run: git fetch --no-tags --depth=1 origin 6a74bc0ab69314b4c032003bbcb29ea7acb4b45a
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Review inherited problem index
        run: node scripts/stage-review.mjs catalog
      - name: Apply source-bound complete integration and normal minor version
        run: node scripts/prepare-local-pins-2f96.mjs apply
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reproduce original pin refresh and unrelated-column write failures
        run: node scripts/prepare-local-pins-2f96.mjs baseline
      - name: Pin core and unchanged save protections
        run: node --test scripts/local-pins.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Real pinned workspace and original list menu tests
        run: npx vitest run --root=. src/components/PinnedNotesPanel.test.jsx src/components/FileListPin.legacy-safety.test.jsx src/services/localPins.test.js --reporter=json --outputFile=pin-module-evidence/targeted.json
      - name: All original UI regression and pinned-note workflow
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=pin-module-evidence/full-ui.json
      - name: Real production SQLite regression and pin concurrency
        run: |
          go -C server test -json ./... > pin-module-evidence/go-tests.jsonl
          go -C server test -race ./internal/dao -run LocalPin -count=1
      - name: Full original main preload and renderer builds
        run: npm run build:main && npm run build:renderer
      - name: Publish only verified changed code objects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-local-pins-2f96.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-pins-verification-${{ github.sha }}
          path: pin-module-evidence/
          retention-days: 7
          if-no-files-found: error
