name: Complete Wiki target error classification and original workflow
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Preserve inherited issue and execution catalog
        run: node scripts/stage-review.mjs catalog
      - name: Reproduce the actual lost business identity before repair
        run: node scripts/repair-wiki-api-errors.mjs baseline
      - name: Apply exact runtime repair and normal patch version
        run: node scripts/repair-wiki-api-errors.mjs apply
      - name: Install original locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Real API identity and all original Wiki recent pin save quit contracts
        run: node --test --test-reporter=tap scripts/wiki-api-errors.node.mjs scripts/wiki-navigation.node.mjs scripts/recent-notes.node.mjs scripts/recent-reopen.node.mjs scripts/local-pins.node.mjs scripts/pin-journal-boundaries.node.mjs scripts/pin-recovery-ownership.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs > wiki-api-evidence/node.tap
      - name: Real App Wiki preview shared API and original discard regression
        run: npx vitest run --root=. src/App.wikiNavigation.test.jsx src/components/Editor/nodes/WikiLinkView.test.jsx src/services/wikiNavigation.test.js src/services/wikiApiErrors.test.js src/AppExitDiscard.test.jsx --reporter=json --outputFile=wiki-api-evidence/targeted.json
      - name: Full original UI regression
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=wiki-api-evidence/full-ui.json
      - name: Unchanged production Go regression
        run: go -C server test -json ./... > wiki-api-evidence/go-tests.jsonl
      - name: Complete original main preload and renderer builds
        run: npm run build:main && npm run build:renderer
      - name: Verify source identity after all execution
        run: node scripts/repair-wiki-api-errors.mjs check
      - name: Publish only verified repaired code objects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repair-wiki-api-errors.mjs publish
      - name: Preserve complete or failed raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-api-repair-${{ github.sha }}
          path: wiki-api-evidence/
          retention-days: 7
          if-no-files-found: error
