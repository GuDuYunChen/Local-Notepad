name: Complete note tag cross-module native readiness
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Preserve source identity and original assertions
        run: node scripts/repair-template-row-wait.mjs apply
      - name: Review historical issue catalog and lock
        run: node scripts/stage-review.mjs catalog && node scripts/verify-dependency-lock.mjs
      - name: Install exact committed dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove receipt-before-row in the original React component
        run: npx vitest run --root=. src/components/TemplateLibrary.test.jsx --reporter=json --outputFile=tag-module-evidence/template-readiness.json
      - name: Full original UI and local tags
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=tag-module-evidence/full-ui.json
      - name: Original tag and save protections
        run: node --test scripts/note-tags.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Original main preload and renderer build
        run: npm run build:main && npm run build:renderer
      - name: Emit two verified test code objects only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repair-template-row-wait.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note-tags-native-readiness-${{ github.sha }}
          path: tag-module-evidence/
          retention-days: 7
          if-no-files-found: error
