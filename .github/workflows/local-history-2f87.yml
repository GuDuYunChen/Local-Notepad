name: Close cross-module list ownership regression
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Verify historical issues and locked dependencies
        run: node scripts/stage-review.mjs catalog && node scripts/verify-dependency-lock.mjs
      - name: Cover pre-navigation snapshots missing a newly selected note
        run: node scripts/extend-list-snapshot.mjs
      - name: Install committed lock
        run: npm ci --no-audit --no-fund
      - name: Reproduce original asynchronous list selection defects
        run: node scripts/repair-list-refresh.mjs baseline
      - name: Repair request and callback ownership with normal patch increment
        run: node scripts/repair-list-refresh.mjs apply
      - name: All original UI regression tests
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=refresh-evidence/full-ui.json
      - name: Original save protections and production Go SQLite regression
        run: |
          node --test scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs scripts/template-library.node.mjs scripts/daily-notes.node.mjs
          go -C server test -json ./... > refresh-evidence/go-tests.jsonl
          go -C server test -race ./internal/dao -run 'Template|Daily' -count=1
      - name: Complete main preload and renderer build
        run: npm run build:main && npm run build:renderer
      - name: Publish verified code objects without changing product refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repair-list-refresh.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: list-refresh-verification-${{ github.sha }}
          path: refresh-evidence/
          if-no-files-found: error
          retention-days: 7
