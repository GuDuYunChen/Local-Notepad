name: Verify complete local quick navigation
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact accepted baseline for negative controls
        run: git fetch --no-tags --depth=1 origin 6100a3522e875bf4247bcc48a6742f4f2c97a3a9
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Review historical issue catalog
        run: node scripts/stage-review.mjs catalog
      - name: Apply guarded integration and standard minor version
        run: node scripts/prepare-quick-switcher-2f90.mjs apply
      - name: Complete navigation ownership and real retry focus coverage
        run: node scripts/complete-quick-lifecycle.mjs
      - name: Install exact committed lock
        run: npm ci --no-audit --no-fund
      - name: Reproduce original quick search navigation defects
        run: node scripts/prepare-quick-switcher-2f90.mjs baseline
      - name: Original and new local navigation contracts
        run: node --test scripts/quick-switcher.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Full UI regression including real App decisions
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=default --reporter=json --outputFile=quick-module-evidence/full-ui.json
      - name: Complete production Go SQLite regression
        run: go -C server test -json ./... > quick-module-evidence/go-tests.jsonl
      - name: Full original main preload renderer build
        run: npm run build:main && npm run build:renderer
      - name: Publish tested changed code objects only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-quick-switcher-2f90.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-module-verification-${{ github.sha }}
          path: quick-module-evidence/
          retention-days: 7
          if-no-files-found: error
