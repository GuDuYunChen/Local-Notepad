name: Verify complete local document search and replacement
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact accepted search implementation for negative controls
        run: git fetch --no-tags --depth=1 origin 30ba71615682ef9ee06cacca18620ca9efea0576
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Review historical issues and exact source integration
        run: node scripts/stage-review.mjs catalog && node scripts/prepare-document-search-2f93.mjs apply
      - name: Install committed dependency lock
        run: npm ci --no-audit --no-fund
      - name: Reproduce Unicode offset boundary and formatted-text failures
        run: node scripts/prepare-document-search-2f93.mjs baseline
      - name: Verify real Lexical search replacements and React lifecycle
        run: npx vitest run --root=. src/services/documentSearch.test.js src/components/Editor/plugins/SearchPlugin.test.js src/components/Editor/plugins/SearchPlugin.legacy-safety.test.jsx src/components/Editor/plugins/documentSearchLexical.test.jsx src/components/Editor/plugins/SearchPlugin.lifecycle.test.jsx --reporter=default --reporter=json --outputFile=document-search-evidence/module-tests.json
      - name: Full original UI regression
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=document-search-evidence/full-ui.json
      - name: Original save draft and exit regression
        run: node --test scripts/document-search.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Production Go regression
        run: go -C server test -json ./... > document-search-evidence/go-tests.jsonl
      - name: Complete main preload and renderer build
        run: npm run build:main && npm run build:renderer
      - name: Publish verified changed code objects only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-document-search-2f93.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-search-verification-${{ github.sha }}
          path: document-search-evidence/
          retention-days: 7
          if-no-files-found: error
