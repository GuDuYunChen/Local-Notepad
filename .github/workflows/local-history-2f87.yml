name: Verify document search and original tag entry readiness
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Preserve original tag source and wait for read completion before click
        run: node scripts/repair-search-tag-entry.mjs apply
      - name: Review inherited issues and committed dependency lock
        run: node scripts/stage-review.mjs catalog && node scripts/verify-dependency-lock.mjs
      - name: Install exact committed dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify actual tag loading lifecycle and complete document search
        run: npx vitest run --root=. src/components/TagSelector.test.jsx src/components/Editor/plugins/SearchPlugin.lifecycle.test.jsx --reporter=json --outputFile=document-search-evidence/readiness.json
      - name: Full original UI regression
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=document-search-evidence/full-ui.json
      - name: Original search save cache and quit protections
        run: node --test scripts/document-search.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Complete original main preload and renderer build
        run: npm run build:main && npm run build:renderer
      - name: Emit only two verified test objects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repair-search-tag-entry.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-search-entry-${{ github.sha }}
          path: document-search-evidence/
          retention-days: 7
          if-no-files-found: error
