name: Verify complete local daily notes module
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Verify accepted inputs and integrate daily module with standard minor version
        run: node scripts/prepare-daily-module.mjs apply
      - name: Repair canonical blank daily initialization without changing editor protections
        run: node scripts/prepare-daily-empty.mjs apply
      - name: Verify historical issue catalog
        run: node scripts/stage-review.mjs catalog
      - name: Install committed dependency lock
        run: npm ci --no-audit --no-fund
      - name: Verify version and unchanged dependency graph
        run: node scripts/check-app-version.mjs --previous-version=4.220.2 && node scripts/verify-dependency-lock.mjs
      - name: Run daily service and original save protection tests
        run: node --test scripts/daily-notes.node.mjs scripts/editor-draft-recovery.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-discard.node.mjs scripts/editor-quit.node.mjs scripts/editor-cache-regression.node.mjs
      - name: Full UI regression including the daily module
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=default --reporter=json --outputFile=daily-evidence/full-ui.json
      - name: Full production Go and disk SQLite regression
        working-directory: server
        run: go test ./... -count=1
      - name: Build original main preload and complete renderer
        run: npm run build:main && npm run build:renderer
      - name: Publish tested code objects without changing product refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/prepare-daily-module.mjs publish
          node scripts/prepare-daily-empty.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-module-verification-${{ github.sha }}
          path: daily-evidence/
          retention-days: 7
          if-no-files-found: error
