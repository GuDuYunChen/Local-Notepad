name: Complete pinned-note final candidate verification
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: read
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the exact accepted baseline for identity checks
        run: git fetch --no-tags --depth=1 origin 6a74bc0ab69314b4c032003bbcb29ea7acb4b45a
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Verify complete candidate identity and unchanged dependencies
        run: node scripts/check-pins-closeout.mjs
      - name: Review inherited incidents and current version
        run: node scripts/stage-review.mjs catalog && node scripts/check-app-version.mjs --previous-version=4.228.0 && node scripts/verify-dependency-lock.mjs
      - name: Install only committed dependency lock
        run: npm ci --no-audit --no-fund
      - name: Ensure install preserved committed manifest and lock
        run: git diff --exit-code -- package.json package-lock.json
      - name: All pin recovery boundaries and original save guards
        run: node --test scripts/local-pins.node.mjs scripts/pin-journal-boundaries.node.mjs scripts/pin-recovery-ownership.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs > pin-closeout-evidence/node-contracts.tap
      - name: Actual mounted pinned workspace and original file menu
        run: npx vitest run --root=. src/components/PinnedNotesPanel.test.jsx src/components/FileListPin.legacy-safety.test.jsx src/services/localPins.test.js src/services/localPins.boundaries.test.js src/services/localPins.recovery-ownership.test.js --reporter=json --outputFile=pin-closeout-evidence/targeted.json
      - name: Full original UI regression with final pin changes
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=pin-closeout-evidence/full-ui.json
      - name: Production Go SQLite and concurrent pin writes
        run: |
          go -C server test -json ./... > pin-closeout-evidence/go-tests.jsonl
          go -C server test -race ./internal/dao -run LocalPin -count=1 > pin-closeout-evidence/go-race.txt
      - name: Build original main preload and renderer
        run: npm run build:main && npm run build:renderer
      - name: Verify no source changes during tests or builds
        run: git diff --exit-code
      - name: Retain original complete or failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-closeout-${{ github.sha }}
          path: pin-closeout-evidence/
          retention-days: 7
          if-no-files-found: error
