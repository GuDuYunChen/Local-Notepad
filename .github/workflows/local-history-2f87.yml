name: Verify complete local template library
on:
  push:
    branches: [ci/local-history-2f87]
permissions:
  contents: write
concurrency:
  group: local-history-2f87
  cancel-in-progress: false
jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Apply exact accepted baseline integration and normal version increment
        run: node scripts/prepare-template-library-2f89.mjs apply
      - name: Preserve exact text whitespace and legacy literal JSON when copying
        run: node scripts/repair-template-text-copy.mjs
      - name: Verify historical issue index
        run: node scripts/stage-review.mjs catalog
      - name: Install the committed dependency lock
        run: npm ci --no-audit --no-fund
      - name: Verify version and unchanged dependency graph
        run: node scripts/check-app-version.mjs --previous-version=4.221.1 && node scripts/verify-dependency-lock.mjs
      - name: Template core and original save protection
        run: node --test scripts/template-library.node.mjs scripts/editor-cache-regression.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-quit.node.mjs
      - name: Full original UI regression and template lifecycle
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=default --reporter=json --outputFile=template-module-evidence/full-ui.json
      - name: Complete production Go SQLite regression
        run: |
          go -C server test -json ./... > template-module-evidence/go-tests.jsonl
          go -C server test -race ./internal/dao -run Template -count=1
      - name: Build complete original main preload and renderer
        run: npm run build:main && npm run build:renderer
      - name: Publish tested source objects without changing product refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-template-library-2f89.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-module-verification-${{ github.sha }}
          path: template-module-evidence/
          retention-days: 7
          if-no-files-found: error
