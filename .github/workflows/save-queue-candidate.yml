name: Save Queue Candidate
on:
  push:
    branches: [feature/knowledge-os-phase2]
    paths: [.github/workflows/save-queue-candidate.yml]
permissions:
  contents: write
concurrency:
  group: save-queue-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - run: git fetch --no-tags --depth=1 origin 3c66a5e36189c5876fb8c1e21fd66c7d1d09f19a
      - name: Apply exact compressed patch and verify source identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,gzip,hashlib,urllib.request,subprocess,pathlib
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'save-queue-source-check'}
          sha='97d76a56d28748c91a1c120434885de4d8866136'
          value=json.load(urllib.request.urlopen(urllib.request.Request(root+'/git/blobs/'+sha,headers=headers)))
          compressed=base64.b64decode(value['content'])
          assert hashlib.sha1(b'blob '+str(len(compressed)).encode()+b'\0'+compressed).hexdigest()==sha
          patch=gzip.decompress(compressed)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          expected={
              '.github/workflows/save-recovery-ci.yml':'01a4340082f6fd8934f054b3bcd6fce506b2f95e',
              'docs/EDITOR_SAVE_QUEUE_41896.md':'73a95e24d0e8dc129db8099ea6defc0516cdb154',
              'package.json':'4a73d4434c48bce8958383c1837b0d8e79fe6303',
              'scripts/check-save-queue-baseline.mjs':'7d6b443d7f37207e161c60c830a455d9b5b4ed90',
              'scripts/editor-cache-regression.node.mjs':'3a3be015357433bd9bd47c6723eb8877c9420943',
              'scripts/editor-quit.node.mjs':'63961d334ed8dd50cf50176329f1842bf610f5cc',
              'scripts/integration/EditorSaveQueueOrder.live.jsx':'2df90ff1a04284dbe0647d4e99b7266bebe5b9d6',
              'src/App.jsx':'03aed8f1c261dd17f864dae36ccf93050e90bbd3',
              'src/AppSaveRecovery.test.jsx':'4a84cbab9bc1b92587ec60d5483467a831d3f706',
              'src/components/EditorSaveQueueOrder.test.jsx':'8b07bcedb0f7acddfda7fe9ef97d99b88c6c8d70',
              'src/components/TextEditor.jsx':'fc1cfe4375891175843e513d199ba0539738c630'}
          for file,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',file]).decode().strip()==sha,file
          pathlib.Path('test-results/save-queue-candidate').mkdir(parents=True,exist_ok=True)
          pathlib.Path('test-results/save-queue-candidate/expected.json').write_text(json.dumps(expected,indent=2))
          PY
      - run: npm install --no-audit --no-fund
      - name: Require precise old-code regression reproduction
        run: node scripts/check-save-queue-baseline.mjs
      - name: Existing save, cache and quit protocol
        run: node --test scripts/editor-draft-recovery.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-discard.node.mjs scripts/editor-quit.node.mjs scripts/editor-cache-regression.node.mjs
      - name: Real TextEditor and App queue assertions
        run: npx vitest run --root=. src/components/EditorSaveQueueOrder.test.jsx src/AppSaveRecovery.test.jsx --reporter=json --outputFile=test-results/save-queue-candidate/components.json
      - run: go -C server build -o ../bin/save-test-server ./cmd/notepad-server
      - name: Actual HTTP, SQLite, quit and restart
        env:
          NOTEPAD_SAVE_TEST_SERVER: bin/save-test-server
        run: npx vitest run --config=scripts/save-recovery.vitest.config.mjs --reporter=json --outputFile=test-results/save-queue-candidate/live.json
      - name: Retain tested blobs only; no commits or branch mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request,subprocess,pathlib
          expected=json.loads(pathlib.Path('test-results/save-queue-candidate/expected.json').read_text())
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'save-queue-source-check'}
          for file,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',file]).decode().strip()==sha,file
              data=json.dumps({'encoding':'base64','content':base64.b64encode(pathlib.Path(file).read_bytes()).decode()}).encode()
              value=json.load(urllib.request.urlopen(urllib.request.Request(root+'/git/blobs',data=data,headers=headers)))
              assert value['sha']==sha
          pathlib.Path('test-results/save-queue-candidate/tested-blobs.json').write_text(json.dumps(expected,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-queue-candidate-${{ github.sha }}
          path: |
            test-results/save-queue-candidate/*
            test-results/save-recovery/queue-order-baseline*
          retention-days: 2
          if-no-files-found: error
