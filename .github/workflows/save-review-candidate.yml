name: Save Review Candidate
on:
  push:
    branches: [feature/knowledge-os-phase2]
    paths: [.github/workflows/save-review-candidate.yml]
permissions:
  contents: write
concurrency:
  group: save-review-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Materialize reviewed objects and verify exact candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,gzip,hashlib,urllib.request,subprocess,pathlib
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'save-review-validator'}
          def blob(sha):
              r=json.load(urllib.request.urlopen(urllib.request.Request(root+'/git/blobs/'+sha,headers=headers)))
              b=base64.b64decode(r['content']);assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              return b
          chunks=['c7360f889f3e445611bc10a43a1609f8c38ba51d','1443f1a0d7ed7a14d6d888fd5654f468c8977456','6983326dc0b7ff751f150002499a76a38df5bdc7','dbd0d550676f3d18fae5b1d156a209b3da1ebde0','4ce31ab846b09eadbd8f6969d8ea5e31c4009e33','9a16f1819c7cab176ef4fbc470a5e218f8bca8f9']
          compressed=base64.b64decode(b''.join(blob(s) for s in chunks),validate=True)
          assert hashlib.sha1(b'blob '+str(len(compressed)).encode()+b'\0'+compressed).hexdigest()=='014e4634f47111ffd22e0677e2e28cbbb47fe5a5'
          patch=gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='c3da191a70712c8fb42560795cb37eeeaad52f86fdd35568a6cbd7f1cff04ab9'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          expected={
            '.github/workflows/save-recovery-ci.yml':'764140af330a83d3a86a6f537e940cabd281b22e',
            'docs/EDITOR_SAVE_REVIEW_41892.md':'97eb0cfea06432f3273c1b85db8066e6fc1fcb4b',
            'package.json':'0e6ff471387c59599835d1f7a4f60d61b4215b74',
            'scripts/check-save-conflict-baseline.mjs':'75ef149ccf6fe4960a44124869c37550750df0f5',
            'scripts/editor-cache-regression.node.mjs':'9171f836807f748b1f183fd96d4699dc877adabf',
            'scripts/editor-quit.node.mjs':'3200395e56f64758872926cf72d9adea459c0e52',
            'scripts/editor-save-transaction.node.mjs':'bd98a896f457bb2336dc18684cec452ac4293f81',
            'scripts/integration/AppSaveRecovery.live.jsx':'eaf826a635c5793124d2a2e63344acb3aed9444e',
            'server/internal/dao/editor_save.go':'3d17aaeebee1fb9a550dfd1ea51373596673643e',
            'server/internal/logic/editor_save_test.go':'de8af1f8f68797e0cb3b3ad1a03d4663c0ba5faf',
            'server/internal/model/editor_save.go':'7cff131c1828e84fc075bdc1fabc66e6561bffdb',
            'src/AppSaveRecovery.test.jsx':'b7990fd0e5ff914864e79a0541d08abddf966f03',
            'src/components/EditorSaveConflict.test.jsx':'e283cbcbc760af26b179aafcae99826d379f4d68',
            'src/components/EditorSaveConflictDialog.css':'64ebc45f1d01bc4082f093527c7be7c5a19b4360',
            'src/components/EditorSaveConflictDialog.jsx':'37bb9be0b4ac3f2ac917c6b3d3507f7c11f70aae',
            'src/components/TextEditor.jsx':'d5359229fb7c379ae5a458fe706ce88c8522e441',
            'src/components/TextEditor.test.jsx':'4eedc92df025dbc7e8926b4bc1eac4be20e92f7e',
            'src/services/editorSaveTransaction.mjs':'49fcbea6db41810a2d99ff21001907f9ea8b00b7',
            'src/test/editorSaveReceiptFixture.mjs':'5791a006ac393da7dfa188fba0a81fcc23a493fc'}
          for file,sha in expected.items():assert subprocess.check_output(['git','hash-object',file]).decode().strip()==sha,file
          pathlib.Path('test-results/save-review').mkdir(parents=True,exist_ok=True)
          pathlib.Path('test-results/save-review/expected.json').write_text(json.dumps(expected,indent=2))
          PY
      - run: npm install --no-audit --no-fund
      - run: git fetch --no-tags --depth=1 origin 8480c91d293fbdb1f565da2d710536b1edefd4dd
      - name: Reproduce old acknowledged-cache bug with exact old TextEditor
        run: node scripts/check-save-conflict-baseline.mjs
      - name: Save protocol and existing quit/draft checks
        run: |
          set -o pipefail
          node --test scripts/editor-save-transaction.node.mjs scripts/editor-discard.node.mjs scripts/editor-quit.node.mjs scripts/editor-cache-regression.node.mjs 2>&1 | tee test-results/save-review/node.log
      - name: Complete real UI regression
        run: npx vitest run --root=. --maxWorkers=4 --minWorkers=1 --reporter=json --outputFile=test-results/save-review/full-ui.json
      - name: Actual SQLite and complete backend tests
        run: |
          set -o pipefail
          go -C server test ./... -count=1 2>&1 | tee test-results/save-review/go.log
      - name: Build real backend
        run: go -C server build -o ../test-results/save-review/save-test-server ./cmd/notepad-server
      - name: Actual App and HTTP save conflict, quit, restart and replay
        env:
          NOTEPAD_SAVE_TEST_SERVER: test-results/save-review/save-test-server
        run: npx vitest run --config=scripts/save-recovery.vitest.config.mjs --reporter=json --outputFile=test-results/save-review/live-editor.json
      - name: Retain exact verified file blobs without committing or moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request,subprocess,pathlib
          expected=json.loads(pathlib.Path('test-results/save-review/expected.json').read_text())
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'save-review-validator','Content-Type':'application/json'}
          for file,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',file]).decode().strip()==sha,file
              data=json.dumps({'encoding':'base64','content':base64.b64encode(pathlib.Path(file).read_bytes()).decode()}).encode()
              r=json.load(urllib.request.urlopen(urllib.request.Request(root+'/git/blobs',data=data,headers=headers)));assert r['sha']==sha
          pathlib.Path('test-results/save-review/tested-blobs.json').write_text(json.dumps(expected,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-review-candidate-${{ github.sha }}
          path: |
            test-results/save-review/*
            test-results/save-recovery/*
          retention-days: 2
          if-no-files-found: error
