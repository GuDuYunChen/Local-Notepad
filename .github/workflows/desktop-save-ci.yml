name: Desktop Save End-to-End CI
on:
  push:
    branches: [feature/knowledge-os-phase2]
permissions:
  contents: read
concurrency:
  group: desktop-save-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Verify committed dependency lock
        run: node scripts/verify-dependency-lock.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify install preserved manifest and lock
        run: git diff --exit-code -- package.json package-lock.json
      - name: Validate evidence refusal cases and state-model interleavings
        shell: pwsh
        run: |
          node --test scripts/desktop-save-evidence.node.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run --root=. src/components/EditorStateModel.test.jsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unmodified production main, preload, renderer and backend
        run: npm run build
      - name: Actual Lexical input, Ctrl+S, autosave, failure recovery and native close
        run: node scripts/check-desktop-save.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-save-${{ github.sha }}
          path: test-results/desktop-save/*
          if-no-files-found: error
          retention-days: 7
