name: Desktop Save End-to-End CI
on:
  push:
    branches: [feature/knowledge-os-phase2]
permissions:
  contents: read
concurrency:
  group: desktop-save-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Verify committed dependency lock
        run: node scripts/verify-dependency-lock.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify install preserved manifest and lock
        run: git diff --exit-code -- package.json package-lock.json
      - name: Build canonical rich editor fixture with the production node registry
        shell: pwsh
        run: |
          node scripts/build-reading-mode-fixture.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-local-export-fixture.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate evidence refusal cases and state-model interleavings
        shell: pwsh
        run: |
          node --test scripts/desktop-save-evidence.node.mjs scripts/desktop-window-session.node.mjs scripts/local-import-desktop-evidence.node.mjs scripts/reading-mode-desktop-evidence.node.mjs scripts/reading-mode-save-evidence.node.mjs scripts/reading-mode-desktop-fixture.node.mjs scripts/reading-mode-native-input.node.mjs scripts/shortcut-management-desktop-evidence.node.mjs scripts/local-export-desktop-evidence.node.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run --root=. src/components/EditorStateModel.test.jsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unmodified production main, preload, renderer and backend
        run: npm run build
      - name: Actual Lexical input, Ctrl+S, autosave, failure recovery and native close
        run: node scripts/check-desktop-save.mjs
      - name: Require original desktop acceptance and independent native reading evidence
        run: node scripts/reading-mode-save-evidence.mjs
      - name: Actual shortcut configuration, key dispatch, same-profile restart and native exit
        run: node scripts/run-shortcut-management-desktop.mjs
      - name: Actual local Word and Markdown export, native directory choice, retry and cancellation
        run: node scripts/run-local-export-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-save-${{ github.sha }}
          path: test-results/desktop-save/*
          if-no-files-found: error
          retention-days: 7
