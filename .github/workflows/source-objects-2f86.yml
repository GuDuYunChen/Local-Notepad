name: Author complete 2F86 source objects
on:
  push:
    branches: [ci/source-objects-2f86]
permissions:
  contents: read
jobs:
  source-objects:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/ci/source-objects-2f86'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate and validate two complete source blobs only
        env:
          SOURCE_OBJECT_TOKEN: ${{ github.token }}
        run: node scripts/ci-source-objects-2f86.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-objects-2f86-${{ github.sha }}
          path: test-results/source-objects-2f86/*
          if-no-files-found: error
          retention-days: 7
