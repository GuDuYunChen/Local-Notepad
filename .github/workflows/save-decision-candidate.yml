name: Save Decision Candidate
on:
  push:
    branches: [feature/knowledge-os-phase2]
    paths: [.github/workflows/save-decision-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Apply reviewed patches and verify every final byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib,urllib.request,subprocess,pathlib
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'save-decision-validation'}
          def digest(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def blob(sha):
              response=json.load(urllib.request.urlopen(urllib.request.Request(api+'/git/blobs/'+sha,headers=headers)))
              b=base64.b64decode(response['content']);assert digest(b)==sha;return b
          # The first transmitted diff contains one indented diff header, not a code change.
          core=blob('ecf6d251ed811f344809c73dc14ba91b6f0c12f4').replace(b'\n diff --git',b'\ndiff --git')
          assert digest(core)=='4280b70b1c0a893be8743ced64c021a617e0263a'
          for patch in [core,blob('69359a6f157e69742aca197aeab16e435eabd615')]:
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
          additions={
            'scripts/check-save-decision-baseline.mjs':'244c41fe6528322bdb70517d45a49e44d24d7715',
            'docs/EDITOR_SAVE_DECISION_41893.md':'ecc02dd8075205a20ef8d79445ca93d5449958af'}
          for file,sha in additions.items():pathlib.Path(file).write_bytes(blob(sha))
          expected={**additions,
            '.github/workflows/save-recovery-ci.yml':'b59841397f61ed0d49ff5256553177f9480f24e5',
            'package.json':'8f048cbd510a6f66ed38f6d02796570650af56d4',
            'scripts/editor-cache-regression.node.mjs':'8846bc0b437b6dfb6326404cad60325a731adf47',
            'scripts/integration/AppSaveRecovery.live.jsx':'0738a6a69532a7446cdadc6aa025618c7159d1d2',
            'src/components/EditorSaveConflict.test.jsx':'31ad08d72faafc2e5c72374e64ddd86963793fec',
            'src/components/EditorSaveConflictDialog.css':'eedc64b7b79387cfe42ec6af013764a8eb7cdbaa',
            'src/components/EditorSaveConflictDialog.jsx':'295b122f99dc82d1c3be6ff95e226d3656147cd9',
            'src/components/TextEditor.jsx':'09dcdf9bf744696859a3c93f2d6dbece64f9d79e'}
          for file,sha in expected.items():assert digest(pathlib.Path(file).read_bytes())==sha,file
          pathlib.Path('test-results/save-decision').mkdir(parents=True,exist_ok=True)
          pathlib.Path('test-results/save-decision/expected.json').write_text(json.dumps(expected,indent=2))
          PY
      - run: npm install --no-audit --no-fund
      - run: git fetch --no-tags --depth=1 origin ca9259c21ae0518b6d4f44d21bd7d48a232fedd7
      - name: Reproduce exact old-code defects
        run: node scripts/check-save-decision-baseline.mjs
      - name: Protocol and original exit/cache guards
        run: node --test scripts/editor-save-transaction.node.mjs scripts/editor-discard.node.mjs scripts/editor-quit.node.mjs scripts/editor-cache-regression.node.mjs
      - name: Actual conflict and App component regressions
        run: npx vitest run --root=. src/components/EditorSaveConflict.test.jsx src/AppSaveRecovery.test.jsx --reporter=json --outputFile=test-results/save-decision/components.json
      - run: go -C server build -o ../bin/save-test-server ./cmd/notepad-server
      - name: Actual App, HTTP, SQLite and restart scenarios
        env:
          NOTEPAD_SAVE_TEST_SERVER: bin/save-test-server
        run: npx vitest run --config=scripts/save-recovery.vitest.config.mjs --reporter=json --outputFile=test-results/save-decision/live.json
      - name: Store only verified source blobs without commits or ref mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib,urllib.request,pathlib
          expected=json.loads(pathlib.Path('test-results/save-decision/expected.json').read_text())
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'save-decision-validation','Content-Type':'application/json'}
          for file,sha in expected.items():
              b=pathlib.Path(file).read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,file
              payload=json.dumps({'encoding':'base64','content':base64.b64encode(b).decode()}).encode()
              response=json.load(urllib.request.urlopen(urllib.request.Request(url,data=payload,headers=headers)))
              assert response['sha']==sha
          pathlib.Path('test-results/save-decision/tested-blobs.json').write_text(json.dumps(expected,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-decision-candidate-${{ github.sha }}
          path: |
            test-results/save-decision/*
            test-results/save-recovery/conflict-decision-baseline*
          retention-days: 2
          if-no-files-found: error
