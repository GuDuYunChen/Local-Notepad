name: Search delivery source snapshot
on:
  push:
    branches: [feature/ui-redesign-v1]
    paths: [.github/workflows/search-delivery-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-tree.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: search-delivery-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/source-tree.txt
          retention-days: 1
