name: Import frozen trash recovery candidate 2F112
on:
  push:
    branches: [feature/local-trash-recovery-2f112]
    paths:
      - .github/workflows/import-trash-recovery-2f112.yml
      - .github/trash-recovery-2f112/**
permissions:
  contents: write
concurrency:
  group: import-frozen-trash-recovery-2f112
  cancel-in-progress: false
jobs:
  import-reviewed-tree:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/feature/local-trash-recovery-2f112'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify and publish only the exact tested source
        shell: bash
        env:
          GIT_AUTHOR_NAME: Trash recovery candidate import
          GIT_AUTHOR_EMAIL: candidate-import@users.noreply.github.com
          GIT_COMMITTER_NAME: Trash recovery candidate import
          GIT_COMMITTER_EMAIL: candidate-import@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          BASE='8683fc5119a1f53269e7bff9acdb01daa26e0b23'
          BASE_TREE='7418529253ded3266a27a196b60aaa1c04729b16'
          TREE='674e80a365c0d18be74f7d4abe5b0a2ef866f0ac'
          REF='refs/heads/feature/local-trash-recovery-2f112'
          def git(*a,data=None):return subprocess.check_output(['git',*a],input=data).decode().strip()
          def require(ok,message):
              if not ok:raise RuntimeError(message)
          head=os.environ['GITHUB_SHA']
          require(git('rev-parse','HEAD')==head,'Wrong checkout')
          require(git('rev-parse','HEAD^')==BASE,'Unexpected parent')
          require(git('rev-parse',BASE+'^{tree}')==BASE_TREE,'Wrong accepted baseline')
          paths={'.github/workflows/import-trash-recovery-2f112.yml'}|{f'.github/trash-recovery-2f112/part{i}.txt' for i in (1,2,3)}
          require(set(git('diff','--name-only',BASE,head).splitlines())==paths,'Unreviewed transport changes')
          parts=[pathlib.Path(f'.github/trash-recovery-2f112/part{i}.txt').read_bytes() for i in (1,2,3)]
          require([len(p) for p in parts]==[16000,16000,13260],'Incomplete payload')
          compressed=base64.b64decode(b''.join(parts),validate=True)
          require(len(compressed)==33944 and hashlib.sha256(compressed).hexdigest()=='50f724c8124051854b695a0615106aea8e2a843c9e0a2499b78e27ea0256d244','Payload mismatch')
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          patch=decoder.decompress(compressed,max_length=141057)
          require(len(patch)==141056 and decoder.eof and not decoder.unused_data,'Unexpected patch extent')
          require(hashlib.sha256(patch).hexdigest()=='2276fcd7a58a308a64eecdd3af0460bcc988b28460b9947e7aa600d9e1814e0f','Patch digest mismatch')
          require(git('ls-remote','origin','refs/heads/master').split()[0]==BASE,'Master changed; review first')
          require(git('ls-remote','origin',REF).split()[0]==head,'Feature changed')
          git('read-tree',BASE);git('apply','--cached','--binary','-',data=patch)
          require(git('write-tree')==TREE,'Not the tested tree')
          message=('feat: complete local trash recovery workspace 2F.112 / 4.245.0\n\n'
                   'Publish exact locally tested tree674e80a365c0d18be74f7d4abe5b0a2ef866f0ac. '
                   'Settings entry,complete bounded metadata snapshot,query/type/50-row paging,cross-page selection, '
                   'frozen full-subtree preview,original or explicit destination,atomic revision-bound restore without overwrite, '
                   'durable intent before send,quota refusal,cancel/error handling,readonly reconciliation without replay and original guarded opening. '
                   'No permanent deletion,note-body/tag/history/attachment writes,schema migration,dependency or cloud changes. '
                   'Actual local unfiltered Vitest338 files/5669 pass,0fail/skip; originalUI1974/Electron657/fullGo1.24.11/main/renderer builds pass. '
                   'Inherited installation contracts and13 release bindings pass; original saving protections and679 dependencies unchanged. '
                   'Current productCI,new installer and complete Windows/native installation evidence remain required. '
                   'Transport is not acceptance and is absent from final source.\n')
          commit=git('commit-tree',TREE,'-p',head,data=message.encode())
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'trash-recovery-2f112-import';out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),commit],check=True)
          (out/'source-manifest.txt').write_text(git('ls-tree','-r',commit)+'\n')
          report={'baseline':BASE,'bootstrap':head,'commit':commit,'tree':TREE,'branch':REF,'sourceArchiveSHA256':hashlib.sha256((out/'source.tar.gz').read_bytes()).hexdigest(),'branchUpdated':False,'nativeAccepted':False}
          (out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          require(git('ls-remote','origin',REF).split()[0]==head,'Concurrent feature update')
          subprocess.run(['git','push','origin',commit+':'+REF],check=True)
          require(git('ls-remote','origin',REF).split()[0]==commit,'Published branch mismatch')
          report['branchUpdated']=True;(out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          PY
      - name: Preserve exact source and publication receipt, not acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-trash-recovery-2f112-source-${{ github.sha }}
          path: ${{ runner.temp }}/trash-recovery-2f112-import/
          if-no-files-found: warn
          retention-days: 7
