name: Import frozen local actions acceptance fix
on:
  push:
    branches: [ci/local-actions-receipt-import]
    paths: [.github/workflows/import-local-actions-receipt.yml, .github/local-actions-receipt-fix.txt]
permissions:
  contents: write
jobs:
  import-only:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/ci/local-actions-receipt-import'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify frozen patch and source before updating only the transport branch
        shell: bash
        env:
          GIT_AUTHOR_NAME: Local actions verified repair import
          GIT_AUTHOR_EMAIL: candidate-import@users.noreply.github.com
          GIT_COMMITTER_NAME: Local actions verified repair import
          GIT_COMMITTER_EMAIL: candidate-import@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,os,pathlib,subprocess
          BASE='5403c821fc226092d02e3b616a6483461de487c5'
          TREE='9b3701e7318d902554da4d012a81eb2152fc7bb8'
          REF='refs/heads/ci/local-actions-receipt-import'
          def git(*a,data=None):return subprocess.check_output(['git',*a],input=data).decode().strip()
          def require(ok,message):
              if not ok:raise RuntimeError(message)
          head=os.environ['GITHUB_SHA']
          require(git('rev-parse','HEAD')==head and git('rev-parse','HEAD^')==BASE,'Unexpected transport source')
          require(git('rev-parse',BASE+'^{tree}')=='4940e5b59d51cdc31b534ae59a2e34f825caceb0','Unexpected product baseline')
          require(set(git('diff','--name-only',BASE,head).splitlines())=={'.github/local-actions-receipt-fix.txt','.github/workflows/import-local-actions-receipt.yml'},'Unreviewed transport')
          encoded=pathlib.Path('.github/local-actions-receipt-fix.txt').read_bytes()
          require(len(encoded)==6608,'Truncated transport')
          compressed=base64.b64decode(encoded,validate=True)
          require(len(compressed)==4956 and hashlib.sha256(compressed).hexdigest()=='53dd0b886a55fde21f7da15f23193e639cc6a99a91c2fdb1153d955c974b1930','Payload mismatch')
          decoder=lzma.LZMADecompressor(memlimit=134217728);patch=decoder.decompress(compressed,max_length=14164)
          require(len(patch)==14163 and decoder.eof and not decoder.unused_data,'Unexpected patch extent')
          require(hashlib.sha256(patch).hexdigest()=='6e8f675dca8271c21901ad88d86879b1cacb288307f04a5259b373101219ba6b','Patch digest mismatch')
          require(git('ls-remote','origin','refs/heads/feature/local-actions-2f110').split()[0]==BASE,'Feature changed; re-review required')
          require(git('ls-remote','origin','refs/heads/master').split()[0]=='bf5f0ed5cb4cad4a1f1b0f874a87fa093b47f6e4','Master changed')
          git('read-tree',BASE);git('apply','--cached','--binary','-',data=patch)
          require(git('write-tree')==TREE,'Not the complete tested tree')
          message=('fix: acknowledge owned local navigation before React commits\n\n'
                   'Native81 artifact12835740668 preserves actual failure: destination opened but palette mistook its own accepted navigation for external change. '
                   'Three actual-App synchronous React commit cases fail on old source with11 original controls passing. '
                   'Notify once from original acceptance before promise continuation; preserve cancellation, external invalidation, target identity and late-result refusal. '
                   'Unfiltered5483/5483, originalUI/Electron/Go/main/renderer all pass locally. '
                   'Exact tested tree9b3701e7318d902554da4d012a81eb2152fc7bb8; original save/draft/quit sources, lock, schema and4.243.0 module scope unchanged. '
                   'Current source-bound product CI/new installer/native and full installation acceptance still required. No module acceptance claim.\n')
          commit=git('commit-tree',TREE,'-p',head,data=message.encode())
          require(git('ls-remote','origin',REF).split()[0]==head,'Transport changed')
          subprocess.run(['git','push','origin',commit+':'+REF],check=True)
          require(git('ls-remote','origin',REF).split()[0]==commit,'Transport branch publication not verified')
          print('Frozen repair commit='+commit+' tree='+TREE+'; product/master/main not updated by this workflow')
          PY
