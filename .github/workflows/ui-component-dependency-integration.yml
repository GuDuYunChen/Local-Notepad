name: UI component dependency integration
on:
  push:
    branches: [fix/local-ui-consistency-2f116]
    paths:
      - .github/workflows/ui-component-dependency-integration.yml
permissions:
  contents: write
jobs:
  lock-component-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-ui-consistency-2f116
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Load reviewed dependency replay from workflow source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA" 93fa4f9aaa0b806838833e02156e7bb2e2a7f36b 1c8ec5689847a580ce307b9157fbbc8c1ac43a8f
          mkdir -p "$RUNNER_TEMP/ui-dependency-replay"
          git show "${GITHUB_SHA}:scripts/apply-reviewed-ui-dependency.mjs" > "$RUNNER_TEMP/ui-dependency-replay/apply-reviewed-ui-dependency.mjs"
          git show "${GITHUB_SHA}:scripts/verify-dependency-lock.mjs" > "$RUNNER_TEMP/ui-dependency-replay/verify-dependency-lock.mjs"
      - name: Add exact Ant Design dependency and regenerate lockfile
        run: node "$RUNNER_TEMP/ui-dependency-replay/apply-reviewed-ui-dependency.mjs"
      - name: Verify generated dependency lock
        run: node scripts/verify-dependency-lock.mjs
      - name: Verify lockfile reproducibility
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(ui): integrate pinned Ant Design dependency"
          git push origin HEAD:fix/local-ui-consistency-2f116
