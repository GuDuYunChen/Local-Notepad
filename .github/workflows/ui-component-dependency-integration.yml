name: UI component dependency integration
on:
  push:
    branches: [fix/local-ui-consistency-2f116]
    paths:
      - .github/workflows/ui-component-dependency-integration.yml
permissions:
  contents: write
jobs:
  lock-component-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-ui-consistency-2f116
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add exact Ant Design dependency and regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact antd@6.6.8 --no-audit --no-fund
      - name: Verify lockfile reproducibility
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(ui): integrate pinned Ant Design dependency"
          git push origin HEAD:fix/local-ui-consistency-2f116
