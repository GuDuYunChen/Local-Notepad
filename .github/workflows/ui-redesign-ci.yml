name: UI Redesign CI

on:
  push:
    branches:
      - feature/ui-redesign-v1
  pull_request:
    branches:
      - master

jobs:
  renderer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build:renderer

      - name: Run redesign smoke tests
        run: npm run test:ui

      - name: Run backend tests
        working-directory: server
        run: go test ./...

      - name: Run legacy editor tests
        continue-on-error: true
        run: npm run test:editor
