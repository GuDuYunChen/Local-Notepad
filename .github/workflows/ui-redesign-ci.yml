name: UI Redesign CI

on:
  push:
    branches:
      - feature/ui-redesign-v1
  pull_request:
    branches:
      - master

jobs:
  renderer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build:renderer
