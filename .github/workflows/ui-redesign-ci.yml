name: UI Redesign CI

on:
  push:
    branches:
      - feature/ui-redesign-v1
      - feature/knowledge-os-phase1
      - feature/knowledge-os-phase2
  pull_request:
    branches:
      - master

concurrency:
  group: ui-redesign-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Electron main/preload
        run: npm run build:main

      - name: Build renderer
        run: npm run build:renderer

      - name: Run redesign smoke tests
        run: npm run test:ui

      - name: Verify sync activity and cancellation UI
        run: |
          node --test scripts/sync-activity.node.mjs
          npx vitest run --root=. src/components/SyncActivityPanel.test.jsx
          go -C server test -race ./internal/syncjob -count=1

      - name: Run backend tests
        working-directory: server
        run: go test ./...

      - name: Search cache race and parser benchmark
        working-directory: server
        run: |
          go test -race ./internal/search -count=1
          go test ./internal/search -run '^$' -bench BenchmarkParsedSearch -benchmem -benchtime=200ms -count=3

      - name: Cross-build Windows backend
        working-directory: server
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o bin/notepad-server.exe ./cmd/notepad-server

      - name: Run backend HTTP smoke
        env:
          NOTEPAD_SMOKE_PORT: '27129'
        run: bash .github/scripts/backend-smoke.sh

      - name: Run Electron tests
        run: npm run test:electron

      - name: Run editor tests
        run: npm run test:editor


  windows-package:
    if: github.event_name == 'push'
    needs: renderer-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify portable workspace transactions on Windows
        run: npx vitest run --root=. electron/workspace-package.test.js electron/workspace-restore.test.js

      - name: Build unsigned Windows NSIS package
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build

      - name: Verify brand and dark-theme rendering
        run: npm run test:brand-render

      - name: Upload theme render checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-theme-${{ github.sha }}
          path: test-results/brand-theme/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify native reading storage
        run: node scripts/check-study-renderer.mjs

      - name: Verify packaged Windows application
        shell: pwsh
        run: .\.github\scripts\windows-package-smoke.ps1

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-windows-${{ github.sha }}
          path: release/Notepad-*-Setup.exe
          if-no-files-found: error
          retention-days: 7
