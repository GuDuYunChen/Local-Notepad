name: Editor Discard Regression CI
on:
  push:
    branches: [feature/knowledge-os-phase2]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: editor-discard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the exact regression baseline independent of branch depth
        run: git fetch --no-tags --depth=1 origin 40c1d2f0620f7424670532975fb10e76746940d9
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify committed dependency lock
        run: node scripts/verify-dependency-lock.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify install preserved manifest and lock
        run: git diff --exit-code -- package.json package-lock.json
      - name: Reproduce the reported exit block on the exact old code
        run: node scripts/check-editor-discard-baseline.mjs
      - name: Verify exact discard and unchanged quit protocol
        run: node --test scripts/editor-discard.node.mjs scripts/editor-quit.node.mjs scripts/editor-cache-regression.node.mjs
      - name: Verify real App discard dialogs, editor cache, saves and quit bridge
        run: npx vitest run --root=. src/AppExitDiscard.test.jsx src/components/EditorQuit.test.jsx src/components/EditorQuitSource.test.jsx src/components/TextEditor.test.jsx src/components/TextEditorLoad.test.jsx
      - name: Record full UI regression results
        run: npx vitest run --root=. --reporter=json --outputFile=test-results/editor-discard/full-ui.json
      - name: Retain exact tracked test sources for failure review
        if: always()
        run: |
          node -e "require('node:fs').mkdirSync('test-results/editor-discard',{recursive:true})"
          git archive --format=zip --output=test-results/editor-discard/tracked-source.zip HEAD src scripts package.json vitest.config.js vitest.setup.js
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-discard-evidence-${{ runner.os }}-${{ github.sha }}
          path: test-results/editor-discard/*
          retention-days: 3
          if-no-files-found: error
