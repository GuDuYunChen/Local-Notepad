name: Import frozen folder workspace candidate 2F111
on:
  push:
    branches: [feature/local-folder-workspace-2f111]
    paths:
      - .github/workflows/import-folder-workspace-2f111.yml
      - .github/folder-workspace-2f111/**
permissions:
  contents: write
concurrency:
  group: import-frozen-folder-workspace-2f111
  cancel-in-progress: false
jobs:
  import-reviewed-tree:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/feature/local-folder-workspace-2f111'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify and publish only the exact tested source
        shell: bash
        env:
          GIT_AUTHOR_NAME: Folder workspace candidate import
          GIT_AUTHOR_EMAIL: candidate-import@users.noreply.github.com
          GIT_COMMITTER_NAME: Folder workspace candidate import
          GIT_COMMITTER_EMAIL: candidate-import@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          BASE='b0d02d0f1b29054390f55608904e253343e64421'
          BASE_TREE='9b3701e7318d902554da4d012a81eb2152fc7bb8'
          TREE='7418529253ded3266a27a196b60aaa1c04729b16'
          REF='refs/heads/feature/local-folder-workspace-2f111'
          def git(*a,data=None):return subprocess.check_output(['git',*a],input=data).decode().strip()
          def require(ok,message):
              if not ok:raise RuntimeError(message)
          head=os.environ['GITHUB_SHA']
          require(git('rev-parse','HEAD')==head,'Wrong checkout')
          require(git('rev-parse','HEAD^')==BASE,'Unexpected parent')
          require(git('rev-parse',BASE+'^{tree}')==BASE_TREE,'Wrong accepted baseline')
          paths={'.github/workflows/import-folder-workspace-2f111.yml'}|{f'.github/folder-workspace-2f111/part{i}.txt' for i in (1,2,3)}
          require(set(git('diff','--name-only',BASE,head).splitlines())==paths,'Unreviewed transport changes')
          parts=[pathlib.Path(f'.github/folder-workspace-2f111/part{i}.txt').read_bytes() for i in (1,2,3)]
          require([len(p) for p in parts]==[16000,16000,14428],'Incomplete payload')
          compressed=base64.b64decode(b''.join(parts),validate=True)
          require(len(compressed)==34820 and hashlib.sha256(compressed).hexdigest()=='e0d74e25a1294203f34b43e06bc48fd237ee1040dcdc246affdc37ec790f033a','Payload mismatch')
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          patch=decoder.decompress(compressed,max_length=142990)
          require(len(patch)==142989 and decoder.eof and not decoder.unused_data,'Unexpected patch extent')
          require(hashlib.sha256(patch).hexdigest()=='0f76aff9c6a09d866260fe6f5234b666ebef779597af923cc7e00dcb1fbb117b','Patch digest mismatch')
          require(git('ls-remote','origin','refs/heads/master').split()[0]==BASE,'Master changed; review first')
          require(git('ls-remote','origin',REF).split()[0]==head,'Feature changed')
          git('read-tree',BASE);git('apply','--cached','--binary','-',data=patch)
          require(git('write-tree')==TREE,'Not the tested tree')
          message=('feat: complete local folder workspace 2F.111 / 4.244.0\n\n'
                   'Publish exact tested tree7418529253ded3266a27a196b60aaa1c04729b16. '
                   'Settings entry,complete bounded directory snapshot,query and50-row paging,cross-location selections, '
                   'create/rename and atomic revision-bound batch moves,cycle/name-collision refusal,empty-only soft trash, '
                   'durable intent before send,explicit confirmation/cancel,quota refusal,retry and readonly reconciliation without replay. '
                   'No note-body/tag/attachment/history writes, schema migration, dependency change or cloud feature. '
                   'Actual unfiltered Vitest335 files/5580 passed,0fail/skip; originalUI/Electron/fullGo1.24.11/main/renderer builds passed. '
                   'Inherited version/source-pin refusal contracts282 pass;13 active release bindings,six protected sources and679 dependency nodes preserved. '
                   'Current productCI,new installer and complete Windows/native installation evidence remain required. '
                   'Transport is not acceptance and is absent from final source.\n')
          commit=git('commit-tree',TREE,'-p',head,data=message.encode())
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'folder-workspace-2f111-import';out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),commit],check=True)
          (out/'source-manifest.txt').write_text(git('ls-tree','-r',commit)+'\n')
          report={'baseline':BASE,'bootstrap':head,'commit':commit,'tree':TREE,'branch':REF,'sourceArchiveSHA256':hashlib.sha256((out/'source.tar.gz').read_bytes()).hexdigest(),'branchUpdated':False,'nativeAccepted':False}
          (out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          require(git('ls-remote','origin',REF).split()[0]==head,'Concurrent feature update')
          subprocess.run(['git','push','origin',commit+':'+REF],check=True)
          require(git('ls-remote','origin',REF).split()[0]==commit,'Published branch mismatch')
          report['branchUpdated']=True;(out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          PY
      - name: Preserve source and publication receipt, not acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-folder-workspace-2f111-source-${{ github.sha }}
          path: ${{ runner.temp }}/folder-workspace-2f111-import/
          if-no-files-found: warn
          retention-days: 7
