name: Import frozen library statistics candidate 2F107
on:
  push:
    branches: [feature/local-library-statistics-2f107]
    paths:
      - .github/workflows/import-statistics-2f107.yml
      - .github/statistics-2f107-payload/**
permissions:
  contents: write
concurrency:
  group: import-frozen-statistics-2f107
  cancel-in-progress: false
jobs:
  import-reviewed-tree:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/feature/local-library-statistics-2f107'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify exact payload and publish only the frozen tree
        shell: bash
        env:
          GIT_AUTHOR_NAME: Local statistics candidate import
          GIT_AUTHOR_EMAIL: candidate-import@users.noreply.github.com
          GIT_COMMITTER_NAME: Local statistics candidate import
          GIT_COMMITTER_EMAIL: candidate-import@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          BASE='53e216aeb5346ffe311d88b99da5f327a855cdb8'
          BASE_TREE='20a161bdf6b63bc81a669de6aeb3f546411f85b8'
          TREE='d94148952c1dd38110253535533f20e65b7dd761'
          REF='refs/heads/feature/local-library-statistics-2f107'
          def git(*a,data=None): return subprocess.check_output(['git',*a],input=data).decode().strip()
          def require(ok,message):
              if not ok: raise RuntimeError(message)
          head=os.environ['GITHUB_SHA']
          require(git('rev-parse','HEAD')==head,'Wrong checkout')
          require(git('rev-parse','HEAD^')==BASE,'Unexpected parent')
          require(git('rev-parse',BASE+'^{tree}')==BASE_TREE,'Wrong accepted baseline')
          paths={'.github/workflows/import-statistics-2f107.yml'}|{f'.github/statistics-2f107-payload/part{i}.txt' for i in (1,2,3)}
          require(set(git('diff','--name-only',BASE,head).splitlines())==paths,'Unreviewed bootstrap changes')
          parts=[pathlib.Path(f'.github/statistics-2f107-payload/part{i}.txt').read_bytes() for i in (1,2,3)]
          require([len(p) for p in parts]==[11256,11256,11248],'Incomplete payload')
          compressed=base64.b64decode(b''.join(parts),validate=True)
          require(len(compressed)==25320 and hashlib.sha256(compressed).hexdigest()=='7d151214e24e8940b52e1083f3e8e688459a13cbd9a87d3fb2376b849eab137e','Payload digest mismatch')
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          patch=decoder.decompress(compressed,max_length=96655)
          require(len(patch)==96654 and decoder.eof and not decoder.unused_data,'Unexpected patch extent')
          require(hashlib.sha256(patch).hexdigest()=='6c7169c8edbb7aa0465591b903f20210657f83e5ac27d817370d55f9e7c55b0a','Patch digest mismatch')
          require(git('ls-remote','origin','refs/heads/master').split()[0]==BASE,'Master changed; review first')
          require(git('ls-remote','origin',REF).split()[0]==head,'Feature changed; refuse stale publication')
          git('read-tree',BASE);git('apply','--cached','--binary','-',data=patch)
          require(git('write-tree')==TREE,'Not the tested tree')
          message=('feat: complete local library statistics workspace 2F.107 / 4.240.0\n\n'
                   'Publish exact tested tree d94148952c1dd38110253535533f20e65b7dd761. '
                   'Read-only bounded SQLite snapshot; saved-note counts and Unicode searchable characters; '
                   'explicit template/trash/unsupported exclusions; 30-day UTC creation/latest-modification distribution; '
                   'settings entry, filtering/sorting/paging, guarded note opening, privacy-aware JSON export, '
                   'cancellation, stale-result refusal and retry. No note-body writes, schema or dependency changes. '
                   'Actual local unfiltered Vitest5296/5296, originalUI1601/Electron657/Go and main/renderer builds passed. '
                   'The accidental total-packaging attempt failed at blocked network download and is not native evidence. '
                   'Current product CI, new Windows installer and complete native/install verification remain required. '
                   'This transport is not acceptance; transport files are absent from the final tree.\n')
          commit=git('commit-tree',TREE,'-p',head,data=message.encode())
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'statistics-2f107-import';out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),commit],check=True)
          (out/'source-manifest.txt').write_text(git('ls-tree','-r',commit)+'\n')
          report={'baseline':BASE,'bootstrap':head,'commit':commit,'tree':TREE,'branch':REF,'sourceArchiveSHA256':hashlib.sha256((out/'source.tar.gz').read_bytes()).hexdigest(),'branchUpdated':False,'nativeAccepted':False}
          (out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          require(git('ls-remote','origin',REF).split()[0]==head,'Concurrent feature update')
          subprocess.run(['git','push','origin',commit+':'+REF],check=True)
          require(git('ls-remote','origin',REF).split()[0]==commit,'Published branch mismatch')
          report['branchUpdated']=True;(out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          PY
      - name: Preserve source and import receipt, not native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-statistics-2f107-source-${{ github.sha }}
          path: ${{ runner.temp }}/statistics-2f107-import/
          if-no-files-found: warn
          retention-days: 7
