name: Draft Recovery Candidate
on:
  push:
    branches: [feature/knowledge-os-phase2]
    paths: [.github/workflows/draft-recovery-candidate.yml]
permissions:
  contents: write
concurrency:
  group: draft-recovery-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache-dependency-path: server/go.sum
      - name: Apply immutable reviewed objects and verify resulting file identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib,urllib.request,subprocess,pathlib
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'draft-recovery-check'}
          def hash_blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def blob(sha):
              r=json.load(urllib.request.urlopen(urllib.request.Request(root+'/git/blobs/'+sha,headers=headers)))
              b=base64.b64decode(r['content']);assert hash_blob(b)==sha;return b
          patch=blob('309564d6a2815d9c6183eb3a83853ec22523f45c')
          # The upload added one space before this diff header; the normalized
          # bytes must match the exact locally tested patch, not a fuzzy apply.
          patch=patch.replace(b'\n diff --git a/package.json',b'\ndiff --git a/package.json')
          assert hash_blob(patch)=='d2f2dafee45f761f9afa3cee91b9e450d9670f8a'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          added={
            'docs/EDITOR_DRAFT_RECOVERY_41894.md':'149d7620d2adf9eaac525b8501aa810d5aa19ef9',
            'scripts/check-draft-recovery-baseline.mjs':'7cdb188bc6d93e45cb2b358d4a8c8e45d74f52ee',
            'scripts/editor-draft-recovery.node.mjs':'8e6179b09c4158de64cd6dc4409af61cca2c63dc',
            'src/components/EditorDraftRecovery.test.jsx':'ad9c8f7ab649c61674ce3e44b6fd36e972d550a0',
            'src/services/editorDraftRecovery.mjs':'52d59e42646ebddb283d158d47a2fcfe517d6559'}
          expected={**added,
            '.github/workflows/save-recovery-ci.yml':'eae4915d7836b1b804acbcd787ad73878fa73a24',
            'package.json':'b933ec08a3dc21a61ff0da00b444d1dfee97f786',
            'scripts/editor-quit.node.mjs':'50df6092e0b88bd304d53770b251795221a46c46',
            'scripts/integration/AppSaveRecovery.live.jsx':'706da157cbf6b62e304de540fbadc2a74a9cd1bc',
            'src/components/TextEditor.jsx':'af5237388511f5df269990d2036db9376de55976',
            'src/components/TextEditor.test.jsx':'da5a12ee651f97dead9d305d1ed94f52e0582ba1',
            'src/services/editorDraftCache.js':'fd5a7ca0363712d49e33990f7524535601ee3b6e'}
          for file,sha in added.items():
              p=pathlib.Path(file);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(blob(sha))
          for file,sha in expected.items():assert subprocess.check_output(['git','hash-object',file]).decode().strip()==sha,file
          pathlib.Path('test-results/draft-candidate').mkdir(parents=True,exist_ok=True)
          pathlib.Path('test-results/draft-candidate/expected.json').write_text(json.dumps(expected,indent=2))
          PY
      - run: npm install --no-audit --no-fund
      - run: git fetch --no-tags --depth=1 origin 5cf6619336554b4e8af6320ba41e03344f4db0dd
      - name: Require precise original failure reproduction
        run: node scripts/check-draft-recovery-baseline.mjs
      - name: Verify protocol, recovery and existing exit safeguards
        run: node --test scripts/editor-draft-recovery.node.mjs scripts/editor-save-transaction.node.mjs scripts/editor-discard.node.mjs scripts/editor-quit.node.mjs scripts/editor-cache-regression.node.mjs
      - name: Actual recovery and conflict components
        run: npx vitest run --root=. src/components/EditorDraftRecovery.test.jsx src/components/EditorSaveConflict.test.jsx src/AppSaveRecovery.test.jsx --reporter=json --outputFile=test-results/draft-candidate/components.json
      - run: go -C server build -o ../bin/save-test-server ./cmd/notepad-server
      - name: Real App, HTTP, SQLite and restart verification
        env:
          NOTEPAD_SAVE_TEST_SERVER: bin/save-test-server
        run: npx vitest run --config=scripts/save-recovery.vitest.config.mjs --reporter=json --outputFile=test-results/draft-candidate/live.json
      - name: Retain exact tested blobs only; never commit or move a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request,subprocess,pathlib
          expected=json.loads(pathlib.Path('test-results/draft-candidate/expected.json').read_text())
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'draft-recovery-check','Content-Type':'application/json'}
          for file,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',file]).decode().strip()==sha,file
              data=json.dumps({'encoding':'base64','content':base64.b64encode(pathlib.Path(file).read_bytes()).decode()}).encode()
              r=json.load(urllib.request.urlopen(urllib.request.Request(root+'/git/blobs',data=data,headers=headers)));assert r['sha']==sha
          pathlib.Path('test-results/draft-candidate/tested-blobs.json').write_text(json.dumps(expected,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-recovery-candidate-${{ github.sha }}
          path: |
            test-results/draft-candidate/*
            test-results/save-recovery/draft-recovery-baseline*
          retention-days: 2
          if-no-files-found: error
