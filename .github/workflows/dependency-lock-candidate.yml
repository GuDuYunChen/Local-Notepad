name: Dependency Lock Candidate
on:
  push:
    branches: [feature/knowledge-os-phase2]
    paths: [.github/workflows/dependency-lock-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare candidate manifest without changing dependency declarations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.version!=='4.195.0')throw Error('Unexpected source version');
          p.version='4.195.1';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Resolve full cross-platform lock without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund
      - name: Retain candidate bytes and create only an unreferenced Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results/lock-candidate
          cp package.json package-lock.json test-results/lock-candidate/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const content=fs.readFileSync('package-lock.json','utf8');
          const body={content,encoding:'utf-8'};
          const res=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,{
            method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'Content-Type':'application/json',Accept:'application/vnd.github+json'},
            body:JSON.stringify(body),signal:AbortSignal.timeout(30000)
          });
          if(!res.ok)throw Error(`Lock blob creation failed: HTTP ${res.status}`);
          const blob=await res.json();
          const identity={sourceCommit:process.env.GITHUB_SHA,repository:process.env.GITHUB_REPOSITORY,blob:blob.sha,
            sha256:createHash('sha256').update(content).digest('hex'),node:process.version,
            electronToChromium:JSON.parse(content).packages['node_modules/electron-to-chromium']?.version,
            dependencyScriptsExecuted:false,branchUpdated:false,acceptance:false};
          fs.writeFileSync('test-results/lock-candidate/identity.json',JSON.stringify(identity,null,2)+'\n');
          console.log(JSON.stringify(identity));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-candidate-${{ github.sha }}
          path: test-results/lock-candidate/*
          if-no-files-found: error
          retention-days: 7
