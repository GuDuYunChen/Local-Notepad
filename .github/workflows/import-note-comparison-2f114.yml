name: Import exact tested note comparison candidate 2F114
on:
  push:
    branches: [feature/local-note-comparison-2f114]
    paths:
      - .github/workflows/import-note-comparison-2f114.yml
      - .github/note-comparison-2f114/**
permissions:
  contents: write
concurrency:
  group: import-frozen-note-comparison-2f114
  cancel-in-progress: false
jobs:
  import-reviewed-tree:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/feature/local-note-comparison-2f114'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify and publish only the complete tested source
        shell: bash
        env:
          GIT_AUTHOR_NAME: Note comparison candidate import
          GIT_AUTHOR_EMAIL: candidate-import@users.noreply.github.com
          GIT_COMMITTER_NAME: Note comparison candidate import
          GIT_COMMITTER_EMAIL: candidate-import@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          BASE='042db00172114d85ad76cff4eba5450d1022d81e'
          BASE_TREE='1bd8858605c2c039cfa628d7ae4a47f52c4ca40b'
          TREE='a2bd9f5244f1d26095c2418f01aa3e79b1017559'
          REF='refs/heads/feature/local-note-comparison-2f114'
          def git(*a,data=None):return subprocess.check_output(['git',*a],input=data).decode().strip()
          def require(ok,message):
              if not ok:raise RuntimeError(message)
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          head=os.environ['GITHUB_SHA']
          require(git('rev-parse','HEAD')==head,'Wrong checkout')
          require(git('rev-parse','HEAD^')==BASE,'Unexpected parent')
          require(git('rev-parse',BASE+'^{tree}')==BASE_TREE,'Wrong accepted baseline')
          paths={'.github/workflows/import-note-comparison-2f114.yml'}|{f'.github/note-comparison-2f114/part{i}.txt' for i in (1,2,3)}
          require(set(git('diff','--name-only',BASE,head).splitlines())==paths,'Unreviewed transport changes')
          parts=[pathlib.Path(f'.github/note-comparison-2f114/part{i}.txt').read_bytes() for i in (1,2,3)]
          require([blob(p) for p in parts]==['79d8ee148a4ec66d3880316f17e467dd40531fc9','75d50d596b2791a48a717c7401455b799aff3d1e','50c48af393354eec37661da63f100e525bbd60b0'],'Transport identity mismatch')
          # A single duplicate base64 character was detected BEFORE any publication.
          # Accept only those exact raw bytes, remove that exact byte, then require
          # the original canonical part, complete compressed payload, patch and tree.
          require(len(parts[0])==14001 and parts[0][3343:3345]==b'cc','Unexpected transport extent')
          parts[0]=parts[0][:3343]+parts[0][3344:]
          require(blob(parts[0])=='98fe47df5a76e8e7189a8c6684e1124f90e6273d','Canonical first part mismatch')
          require(hashlib.sha256(parts[0]).hexdigest()=='fcb9b3882af6fa698c700448b5eb47943f8810a3fcd0b98183d81f5c613714bf','Canonical first part digest mismatch')
          require([len(p) for p in parts]==[14000,14000,13296],'Incomplete payload')
          compressed=base64.b64decode(b''.join(parts),validate=True)
          require(len(compressed)==30972 and hashlib.sha256(compressed).hexdigest()=='4807576ad4422a090b4bfb926f03a7d69bc2a5c5e0758a4998d07a5efc0e8cc9','Payload mismatch')
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          patch=decoder.decompress(compressed,max_length=122422)
          require(len(patch)==122421 and decoder.eof and not decoder.unused_data,'Unexpected patch extent')
          require(hashlib.sha256(patch).hexdigest()=='8b7a72b80331e07a709f7b45aeeac071b7653caf812d654fe4e106f5cd8af5e6','Patch mismatch')
          require(git('ls-remote','origin','refs/heads/master').split()[0]==BASE,'Master changed; review first')
          require(git('ls-remote','origin',REF).split()[0]==head,'Feature changed')
          git('read-tree',BASE);git('apply','--cached','--binary','-',data=patch)
          require(git('write-tree')==TREE,'Not the tested tree')
          message=('feat: complete local two-note comparison 2F.114 / 4.247.0\n\n'
                   'Exact tested treea2bd9f5244f1d26095c2418f01aa3e79b1017559. '
                   'Explicit two-source selection, atomic readonly saved-body pair, bounded exact line differences with literal endings, '
                   'honest text-projection gaps and raw mode, source guard, confirmed privacy-tiered export with fresh-pair revalidation, '
                   'cancellation and late-result refusal, stale data refusal, failures and retry. '
                   'No auto merge, note-body writes, schema/dependency change or cloud feature. '
                   'Actual final unfiltered Vitest344files/5812pass,0fail/skip; UI2117/Electron657/fullGo1.24.11/main/renderer passed. '
                   '178 inherited installation contracts and13 active version bindings pass. '
                   'Current productCI, new installer and complete native/install validation remain required. '
                   'Temporary transport, including its exact one-byte transcription correction, is absent from final source.\n')
          commit=git('commit-tree',TREE,'-p',head,data=message.encode())
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'note-comparison-2f114-import';out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),commit],check=True)
          (out/'source-manifest.txt').write_text(git('ls-tree','-r',commit)+'\n')
          report={'baseline':BASE,'bootstrap':head,'commit':commit,'tree':TREE,'branch':REF,'sourceArchiveSHA256':hashlib.sha256((out/'source.tar.gz').read_bytes()).hexdigest(),'transportCorrection':{'rawBlob':'79d8ee148a4ec66d3880316f17e467dd40531fc9','removedByteOffset':3343,'canonicalBlob':'98fe47df5a76e8e7189a8c6684e1124f90e6273d'},'branchUpdated':False,'nativeAccepted':False}
          (out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          require(git('ls-remote','origin',REF).split()[0]==head,'Concurrent feature update')
          subprocess.run(['git','push','origin',commit+':'+REF],check=True)
          require(git('ls-remote','origin',REF).split()[0]==commit,'Published branch mismatch')
          report['branchUpdated']=True;(out/'receipt.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          PY
      - name: Preserve exact source and publication receipt, not acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-note-comparison-2f114-source-${{ github.sha }}
          path: ${{ runner.temp }}/note-comparison-2f114-import/
          if-no-files-found: warn
          retention-days: 7
