name: UI source recovery
on:
  push:
    branches: [fix/local-ui-consistency-2f116]
    paths: [.github/workflows/ui-source-recovery.yml]
permissions:
  contents: read
jobs:
  source-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Export exact accepted source without modifying product
        shell: bash
        run: |
          set -euo pipefail
          previous=8538e3f41729f245721ef6dff531c6431182a14d
          accepted=1c8ec5689847a580ce307b9157fbbc8c1ac43a8f
          test "$(git rev-parse "$accepted^{tree}")" = 0265d23dfd314fa0e11e57a676ecdcfe8b03a69f
          mkdir -p source-recovery
          git diff --binary --full-index "$previous" "$accepted" > source-recovery/accepted.patch
          git ls-tree -rz "$accepted" > source-recovery/accepted-tree.zlist
          git cat-file commit "$accepted" > source-recovery/accepted-commit.raw
          git diff --name-status "$accepted" HEAD > source-recovery/diagnostic-only.diffstat
          printf 'previous=%s\naccepted=%s\nworkflow=%s\nrun=%s\n' "$previous" "$accepted" "$GITHUB_SHA" "$GITHUB_RUN_ID" > source-recovery/provenance.txt
          (cd source-recovery && sha256sum accepted.patch accepted-tree.zlist accepted-commit.raw diagnostic-only.diffstat provenance.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ui-accepted-source-delta
          path: source-recovery/
          retention-days: 14
          if-no-files-found: error
