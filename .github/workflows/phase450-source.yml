name: Phase 450 source snapshot
on:
  push:
    branches: [feature/ui-redesign-v1]
    paths: [.github/workflows/phase450-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive fixed development baseline
        run: |
          git archive --format=tar.gz HEAD > /tmp/phase450-source.tar.gz
          git ls-tree -r HEAD > /tmp/phase450-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase450-source-${{ github.sha }}
          path: |
            /tmp/phase450-source.tar.gz
            /tmp/phase450-tree.txt
          retention-days: 1
          if-no-files-found: error
