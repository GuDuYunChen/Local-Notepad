name: Complete UI source migration
on:
  push:
    branches: [fix/local-ui-consistency-2f116]
    paths:
      - scripts/migrate-ui-2f116.mjs
      - scripts/ui-migration/**
      - .github/workflows/ui-complete-migration.yml
permissions:
  contents: write
concurrency:
  group: complete-ui-migration-2f116
  cancel-in-progress: false
jobs:
  migrate-complete-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refuse stale or unrelated source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/fix/local-ui-consistency-2f116'
          remote=$(git ls-remote origin refs/heads/fix/local-ui-consistency-2f116 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Install committed lock without changing dependencies
        run: npm ci --no-audit --no-fund
      - name: Migrate every tracked production control and isolate legacy paint
        run: node scripts/migrate-ui-2f116.mjs
      - name: Publish one complete source candidate, never force push
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src docs/quality/ui-migration-2f116.json
          git commit -m 'feat(ui): migrate all eligible application controls and theme integration'
          git push origin HEAD:refs/heads/fix/local-ui-consistency-2f116
          mkdir -p test-results/ui-complete-migration
          git rev-parse HEAD > test-results/ui-complete-migration/commit.txt
          git rev-parse HEAD^{tree} > test-results/ui-complete-migration/tree.txt
          cp docs/quality/ui-migration-2f116.json test-results/ui-complete-migration/
          git diff HEAD^ HEAD --stat > test-results/ui-complete-migration/change-summary.txt
          echo "UI_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Build and run original regression only after the complete migration
        shell: bash
        run: |
          set +e
          mkdir -p test-results/ui-complete-migration
          failed=0
          run_check() {
            label="$1"; shift
            "$@" > "test-results/ui-complete-migration/$label.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$label" "$code" | tee -a test-results/ui-complete-migration/results.tsv
            if [ "$code" -ne 0 ]; then failed=1; tail -n 30 "test-results/ui-complete-migration/$label.log"; fi
          }
          run_check build-main npm run build:main
          run_check build-renderer npm run build:renderer
          run_check original-ui npm run test:ui
          run_check electron npm run test:electron
          run_check editor npm run test:editor
          run_check full-vitest npx vitest run --root=.
          run_check ui-audit npm run test:ui-audit
          exit "$failed"
      - name: Preserve full candidate and failed regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-ui-migration-${{ github.sha }}
          path: |
            test-results/ui-complete-migration/
            docs/quality/ui-migration-2f116.json
          if-no-files-found: warn
          retention-days: 30
