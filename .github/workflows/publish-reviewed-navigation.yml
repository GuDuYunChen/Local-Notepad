name: Publish reviewed comparison navigation source
on:
  push:
    branches: [fix/local-note-comparison-navigation-2f114]
    paths:
      - .github/reviewed-comparison-navigation.patch
      - .github/workflows/publish-reviewed-navigation.yml
permissions:
  contents: write
concurrency:
  group: publish-reviewed-comparison-navigation-2f1141
  cancel-in-progress: false
jobs:
  publish-reviewed-source:
    if: github.repository == 'GuDuYunChen/Local-Notepad' && github.ref == 'refs/heads/fix/local-note-comparison-navigation-2f114'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - name: Validate the readable patch and exact candidate tree before updating this branch
        shell: bash
        env:
          GIT_AUTHOR_NAME: Local Notepad reviewed repair
          GIT_AUTHOR_EMAIL: reviewed-repair@users.noreply.github.com
          GIT_COMMITTER_NAME: Local Notepad reviewed repair
          GIT_COMMITTER_EMAIL: reviewed-repair@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          BASE='770c626e15928dab56f5bbf5f357e26855e812b7'
          BOOTSTRAP='ddd7ecdca004e32f791dcfa8587f93502f02f2f3'
          BASE_TREE='a2bd9f5244f1d26095c2418f01aa3e79b1017559'
          TREE='8443b5a34d0c7948f8c017e22952d0a6b379a359'
          REF='refs/heads/fix/local-note-comparison-navigation-2f114'
          PATCH='.github/reviewed-comparison-navigation.patch'
          def git(*args,data=None):
              return subprocess.check_output(['git',*args],input=data).decode().strip()
          def require(ok,message):
              if not ok: raise RuntimeError(message)
          head=os.environ['GITHUB_SHA']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'navigation-repair-source';out.mkdir()
          require(git('rev-parse','HEAD')==head,'Wrong checkout')
          require(git('rev-parse','HEAD^')==BOOTSTRAP,'Unexpected publication parent')
          require(git('rev-parse','HEAD^^')==BASE,'Unexpected accepted ancestor')
          require(git('rev-parse',BASE+'^{tree}')==BASE_TREE,'Baseline source changed')
          require(set(git('diff','--name-only',BOOTSTRAP,head).splitlines())=={'.github/workflows/publish-reviewed-navigation.yml'},'Unexpected repair changes')
          require(set(git('diff','--name-only',BASE,head).splitlines())=={PATCH,'.github/workflows/publish-reviewed-navigation.yml'},'Unexpected publication files')
          patch=pathlib.Path(PATCH).read_bytes()
          (out/'reviewed.patch').write_bytes(patch)
          require(len(patch)<50000,'Unexpected patch extent')
          require(git('hash-object',PATCH)=='bba86371321618bd5cacbebe5f60473f697fcf49','Readable patch identity changed')
          require(git('ls-remote','origin','refs/heads/master').split()[0]==BASE,'Master advanced; review is required')
          require(git('ls-remote','origin',REF).split()[0]==head,'Repair branch advanced')
          name='src/components/NoteComparison.test.jsx'
          marker=b'diff --git a/src/components/NoteComparison.test.jsx b/src/components/NoteComparison.test.jsx\n'
          require(patch.count(marker)==1,'Missing or ambiguous final append-only test hunk')
          prefix,tests=patch.split(marker)
          require(b'diff --git ' not in tests,'Unexpected following file')
          require(not any(line.startswith(b'-') and not line.startswith(b'--- ') for line in tests.splitlines()),'Test patch is not append-only')
          original=subprocess.check_output(['git','show',BASE+':'+name])
          extra=b''.join(line[1:] for line in tests.splitlines(keepends=True) if line.startswith(b'+') and not line.startswith(b'+++ '))
          test_content=original+extra
          test_blob=hashlib.sha1(b'blob '+str(len(test_content)).encode()+b'\0'+test_content).hexdigest()
          require(test_blob=='be7458cacc5fe51fd1c79f376ac9f41aa187fbe2','Test source differs from the tested complete file')
          git('read-tree',BASE)
          git('apply','--cached','--ignore-space-change','--recount','-',data=prefix)
          require(git('hash-object','-w','--stdin',data=test_content)==test_blob,'Written test blob mismatch')
          git('update-index','--add','--cacheinfo','100644,'+test_blob+','+name)
          require(git('write-tree')==TREE,'Source differs from the complete tested candidate')
          require(len(git('diff','--cached','--name-only',BASE).splitlines())==21,'Unexpected source scope')
          message=('fix: restore distant first-change navigation (2F.114 / 4.247.1)\n\n'
                   'Publish exact tested tree8443b5a34d0c7948f8c017e22952d0a6b379a359. '
                   'First-change pagination, mode changes and repeated explicit relocation retain all cancellation, stale-result and export-confirmation protections. '
                   'No note-body/save/draft/backend/schema/dependency changes. '
                   'Fresh unfiltered344files/5821tests and originalUI122files/2126tests passed before publication. '
                   'The first publication attempt failed only on transcribed unchanged test context. '
                   'The append-only test is reconstructed from accepted baseline plus literal additions and verified against its original full blob; the full tested tree is mandatory. '
                   'Current productCI, actual4.247.1 installer and full native/install acceptance remain required. '
                   'Earlier source notes are candidate preparation history, not a current read-only limitation. '
                   'No compressed or encoded payload; temporary publication files are absent from this final source. Main/master unchanged.\n')
          commit=git('commit-tree',TREE,'-p',head,data=message.encode())
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),commit],check=True)
          (out/'source-manifest.txt').write_text(git('ls-tree','-r',commit)+'\n')
          receipt={'baseline':BASE,'bootstrap':head,'commit':commit,'tree':TREE,'branch':REF,'patchBlob':'bba86371321618bd5cacbebe5f60473f697fcf49','appendOnlyTestBlob':test_blob,'readablePatchSHA256':hashlib.sha256(patch).hexdigest(),'sourceArchiveSHA256':hashlib.sha256((out/'source.tar.gz').read_bytes()).hexdigest(),'branchUpdated':False,'nativeAccepted':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          require(git('ls-remote','origin',REF).split()[0]==head,'Concurrent branch update')
          subprocess.run(['git','push','origin',commit+':'+REF],check=True)
          require(git('ls-remote','origin',REF).split()[0]==commit,'Published commit mismatch')
          receipt['branchUpdated']=True
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Preserve source publication receipt, not native acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-repair-source-${{ github.sha }}
          path: ${{ runner.temp }}/navigation-repair-source/
          if-no-files-found: warn
          retention-days: 7
