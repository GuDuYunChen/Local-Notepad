name: Sync Help Navigation CI
on:
  push:
    branches: [feature/knowledge-os-phase2]
  pull_request:
    branches: [master]
concurrency:
  group: sync-help-navigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  help-navigation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify fixed recommendations, scoped navigation and evidence
        run: node --test scripts/sync-help-navigation.node.mjs scripts/sync-help-navigation-evidence.node.cjs
      - name: Verify real overview and center interaction isolation
        run: npx vitest run --root=. src/components/SyncHelpNavigation.test.jsx
      - name: Build production renderer
        if: runner.os == 'Windows'
        run: npm run build:renderer
      - name: Verify native help navigation and complete evidence
        if: runner.os == 'Windows'
        run: node scripts/check-sync-help-navigation.cjs
      - name: Upload native help navigation evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: local-notepad-sync-help-navigation-${{ github.sha }}
          path: |
            test-results/sync-help-navigation/*.png
            test-results/sync-help-navigation/checks.json
          if-no-files-found: error
          retention-days: 7
